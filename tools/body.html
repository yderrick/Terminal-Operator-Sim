<div id="app">
  <div id="world" class="world" aria-label="Terminal site in 3D"></div>
  <header class="top" id="top"></header>
  <nav class="nav" id="nav" aria-label="Console pages"></nav>
  <aside class="needs" id="side" aria-label="Decisions waiting and radio"></aside>
  <div class="viewbar" id="viewbar" aria-label="View controls"></div>
  <div class="minimap" id="minimap" aria-label="Site map — click to move the camera"></div>
  <div class="inspector" id="inspector" hidden></div>
  <section class="drawer" id="drawer" hidden>
    <div class="drawer-h"><h2 id="drawer-title"></h2><button type="button" class="x" data-a="ui:closeDrawer" aria-label="Close page">×</button></div>
    <main class="main" id="main"></main>
  </section>
  <section class="alarms" id="alarms" aria-label="Alarm summary"></section>
</div>
<div id="tip" class="tip" hidden></div>
<div id="ctx" class="ctx" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="tutor" class="tutor" hidden></div>
<div id="pausebar"></div>
<div id="lesson"></div>
<div id="modal"></div>
<div id="start" class="start"></div>
