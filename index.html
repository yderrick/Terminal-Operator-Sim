<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harrowmere LPG Terminal</title>
<meta name="description" content="Run an LPG terminal for a twelve-hour shift: tanker arrivals, gauging, alarms, permit decisions, scored on safety and throughput.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/hmi.css">
</head>
<body>
<div id="app">
  <div id="world" class="world" aria-label="Terminal site in 3D"></div>
  <header class="top" id="top"></header>
  <nav class="nav" id="nav" aria-label="Console pages"></nav>
  <aside class="needs" id="side" aria-label="Decisions waiting and radio"></aside>
  <div class="viewbar" id="viewbar" aria-label="View controls"></div>
  <div class="minimap" id="minimap" aria-label="Site map — click to move the camera"></div>
  <div class="inspector" id="inspector" hidden></div>
  <section class="drawer" id="drawer" hidden>
    <div class="drawer-h"><h2 id="drawer-title"></h2><button type="button" class="x" data-a="ui:closeDrawer" aria-label="Close page">×</button></div>
    <main class="main" id="main"></main>
  </section>
  <section class="alarms" id="alarms" aria-label="Alarm summary"></section>
</div>
<div id="tip" class="tip" hidden></div>
<div id="ctx" class="ctx" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="pausebar"></div>
<div id="lesson"></div>
<div id="modal"></div>
<div id="start" class="start"></div>
<script src="vendor/three.min.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/physics.js"></script>
<script src="js/core/data.js"></script>
<script src="js/core/content.js"></script>
<script src="js/core/sim.js"></script>
<script src="js/core/plant.js"></script>
<script src="js/core/rack.js"></script>
<script src="js/core/rail.js"></script>
<script src="js/core/crew.js"></script>
<script src="js/core/permits.js"></script>
<script src="js/core/events.js"></script>
<script src="js/core/report.js"></script>
<script src="js/core/autopilot.js"></script>
<script src="js/world/kit.js"></script>
<script src="js/world/site.js"></script>
<script src="js/world/camera.js"></script>
<script src="js/world/actors.js"></script>
<script src="js/world/world.js"></script>
<script src="js/ui/dom.js"></script>
<script src="js/ui/svg.js"></script>
<script src="js/ui/views-ops.js"></script>
<script src="js/ui/views-safety.js"></script>
<script src="js/ui/hud.js"></script>
<script src="js/ui/app.js"></script>
</body>
</html>
