<title>Harrowmere LPG Terminal</title>
<meta name="description" content="Run an LPG terminal for a twelve-hour shift: tanker arrivals, gauging, alarms, permit decisions, scored on safety and throughput.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Harrowmere LPG Terminal — control room HMI.
   Layout: fixed top bar, nav rail left, working area centre, attention column right, alarm summary docked at the bottom.
   ISA-101 high-performance HMI: muted greys for normal, saturated colour reserved for abnormal and alarm states. */
:root {
  --bg: #c4c8c6;          /* console background, slight green-grey */
  --panel: #d6d9d7;
  --panel-2: #e3e5e3;
  --line: #a3a8a6;
  --ink: #1d2224;
  --ink-2: #4b5357;
  --ink-3: #6c7478;
  --proc: #3e474b;        /* process lines and equipment outlines */
  --fill-run: #3e474b;    /* running equipment is filled */
  --liquid: #8d9aa0;
  --liquid-2: #b3bdc1;
  --accent: #1f5f7a;      /* interactive controls */
  --accent-ink: #f2f6f7;
  --ok: #2e6b45;
  --p1: #d8261f; --p1-ink: #fff;
  --p2: #e37a00; --p2-ink: #1d1d1d;
  --p3: #d9b400; --p3-ink: #1d1d1d;
  --p4: #3a7fbf; --p4-ink: #fff;
  --water: #3a7fbf;
  --gas: rgba(217, 180, 0, .38);
  --fire: #e8541c;
  --shadow: 0 1px 0 rgba(0,0,0,.08);
  --f-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --glass: color-mix(in srgb, var(--panel) 90%, transparent);
  --r: 3px;
  --alarm-h: 168px;
  --top-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1f21; --panel: #24292c; --panel-2: #2c3236; --line: #3b4246;
    --ink: #d4d9d8; --ink-2: #a9b1b3; --ink-3: #848d90; --proc: #9aa4a8; --fill-run: #9aa4a8;
    --liquid: #55646b; --liquid-2: #3c474c; --accent: #4f9bbd; --accent-ink: #0d1517; --ok: #58a878;
    --p1: #ff4a3d; --p2: #ff9a1f; --p3: #f2cf2a; --p4: #5ea4e6; --water: #5ea4e6; --gas: rgba(242, 207, 42, .30);
    --shadow: 0 1px 0 rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1f21; --panel: #24292c; --panel-2: #2c3236; --line: #3b4246;
  --ink: #d4d9d8; --ink-2: #a9b1b3; --ink-3: #848d90; --proc: #9aa4a8; --fill-run: #9aa4a8;
  --liquid: #55646b; --liquid-2: #3c474c; --accent: #4f9bbd; --accent-ink: #0d1517; --ok: #58a878;
  --p1: #ff4a3d; --p2: #ff9a1f; --p3: #f2cf2a; --p4: #5ea4e6; --water: #5ea4e6; --gas: rgba(242, 207, 42, .30);
  --shadow: 0 1px 0 rgba(0,0,0,.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; letter-spacing: .02em; margin: 0; text-wrap: balance; }
.num, .tag, code { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
code { font-size: .92em; background: var(--panel-2); padding: 0 .3em; border-radius: 2px; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------- App frame ---------- */
.top { display: flex; align-items: center; gap: 14px; padding: 6px 16px; background: var(--glass); border-bottom: 1px solid var(--line); min-height: 56px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
.brand b { font-family: var(--f-display); font-size: 19px; letter-spacing: .04em; text-transform: uppercase; }
.brand span { font-size: 11px; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
.clock { display: flex; flex-direction: column; align-items: flex-start; }
.clock .num { font-size: 22px; font-weight: 600; line-height: 1; }
.shiftbar { width: 120px; height: 4px; background: var(--line); margin-top: 4px; position: relative; }
.shiftbar i { position: absolute; inset: 0 auto 0 0; background: var(--ink-2); }
.wx { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--ink-2); }
.wx .num { color: var(--ink); }
.wx .lt { padding: 1px 6px; border-radius: 2px; }
.speed { display: flex; gap: 2px; align-items: center; }
.speed button { border: 1px solid var(--line); background: var(--panel-2); padding: 3px 7px; cursor: pointer; font-family: var(--f-data); font-size: 12px; border-radius: 0; }
.speed button:first-child { border-radius: var(--r) 0 0 var(--r); }
.speed button:last-child { border-radius: 0 var(--r) var(--r) 0; }
.speed button.on { background: var(--ink-2); color: var(--panel); border-color: var(--ink-2); }
.scores { display: flex; gap: 10px; margin-left: auto; }
.score { display: grid; grid-template-columns: auto auto; column-gap: 6px; align-items: baseline; min-width: 74px; }
.score label { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); grid-column: 1 / -1; }
.score .num { font-size: 18px; font-weight: 600; }
.score .bar { grid-column: 1 / -1; height: 3px; background: var(--line); }
.score .bar i { display: block; height: 100%; background: var(--ink-2); }
.score.low .bar i { background: var(--p2); }
.score.bad .bar i { background: var(--p1); }
.topbtns { display: flex; gap: 6px; }
.esdbtn { background: var(--p1); color: #fff; border: 2px solid #7a0f0b; font-family: var(--f-display); font-weight: 700; letter-spacing: .08em; padding: 6px 12px; cursor: pointer; border-radius: var(--r); }


/* ---------- Generic blocks ---------- */
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 2px 0 10px; flex-wrap: wrap; }
.sec-h h2 { font-size: 22px; }
.sec-h .sub { color: var(--ink-3); font-size: 13px; }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; min-width: 0; box-shadow: var(--shadow); }
.card h3 { font-size: 17px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card h3 .tag { font-size: 13px; color: var(--ink-3); font-weight: 400; }
.card h4 { font-size: 14px; margin: 10px 0 4px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.card.alert { border-color: var(--p2); box-shadow: inset 3px 0 0 var(--p2); }
.card.crit { border-color: var(--p1); box-shadow: inset 3px 0 0 var(--p1); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; font-size: 13px; margin-top: 6px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-family: var(--f-data); font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row.sp { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.hr { border-top: 1px solid var(--line); margin: 8px 0; }

.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 4px 10px; border-radius: var(--r); cursor: pointer; font-size: 13px; line-height: 1.3; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.quiet { background: var(--panel-2); color: var(--ink); border-color: var(--line); }
.btn.warn { background: var(--p2); border-color: var(--p2); color: var(--p2-ink); }
.btn.danger { background: var(--p1); border-color: var(--p1); color: #fff; }
.btn.sm { padding: 2px 7px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
input[type=number], input[type=text], select, textarea { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 6px; min-width: 0; }
textarea { width: 100%; resize: vertical; }
label.chk { display: flex; gap: 6px; align-items: flex-start; font-size: 13px; cursor: pointer; }

.pill { display: inline-block; padding: 0 6px; border-radius: 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-family: var(--f-display); font-weight: 600; background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.run { background: var(--ink-2); color: var(--panel); border-color: var(--ink-2); }
.pill.ok { color: var(--ok); border-color: var(--ok); }
.pill.p1 { background: var(--p1); color: #fff; border-color: var(--p1); }
.pill.p2 { background: var(--p2); color: #1d1d1d; border-color: var(--p2); }
.pill.p3 { background: var(--p3); color: #1d1d1d; border-color: var(--p3); }
.pill.p4 { background: var(--p4); color: #fff; border-color: var(--p4); }
.pri { display: inline-block; min-width: 24px; text-align: center; font-family: var(--f-data); font-size: 11px; font-weight: 700; padding: 0 3px; border-radius: 2px; }
.pri.p1 { background: var(--p1); color: #fff; } .pri.p2 { background: var(--p2); color: #1d1d1d; } .pri.p3 { background: var(--p3); color: #1d1d1d; } .pri.p4 { background: var(--p4); color: #fff; }

.meter { height: 8px; background: var(--panel-2); border: 1px solid var(--line); position: relative; border-radius: 1px; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--liquid); }
.meter b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); }
.meter.p2 i { background: var(--p2); } .meter.p1 i { background: var(--p1); } .meter.p3 i { background: var(--p3); }

.tbl-wrap { overflow-x: auto; max-width: 100%; }
.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td.num, .tbl th.num { text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.tbl tr.sel td { background: var(--panel-2); }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--panel-2); }

/* ---------- Plant overview SVG ---------- */
.plant-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
svg.plant { display: block; width: 100%; height: auto; font-family: var(--f-data); }
svg.plant .zone { fill: none; stroke: var(--line); stroke-dasharray: 2 1.5; stroke-width: .35; }
svg.plant .zlbl { fill: var(--ink-3); font-size: 3px; font-family: var(--f-display); letter-spacing: .1px; text-transform: uppercase; }
svg.plant .road { stroke: var(--line); stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
svg.plant .pipe { stroke: var(--proc); stroke-width: .7; fill: none; }
svg.plant .pipe.flow { stroke-width: 1.3; stroke-dasharray: 2 1.2; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -3.2; } }
svg.plant .eq { fill: var(--panel-2); stroke: var(--proc); stroke-width: .5; }
svg.plant .eq.run { fill: var(--fill-run); }
svg.plant .eq.trip { stroke: var(--p1); stroke-width: .9; }
svg.plant .liq { fill: var(--liquid); }
svg.plant .lbl { fill: var(--ink); font-size: 3.6px; font-family: var(--f-display); font-weight: 600; }
svg.plant .val { fill: var(--ink-2); font-size: 2.8px; }
svg.plant .val.alm { fill: var(--p1); font-weight: 700; }
svg.plant .hot { cursor: pointer; }
svg.plant .hot:hover .eq, svg.plant .hot:hover rect.lane { stroke: var(--accent); stroke-width: .9; }
svg.plant .lane { fill: none; stroke: var(--line); stroke-width: .4; }
svg.plant .canopy { fill: none; stroke: var(--proc); stroke-width: .4; stroke-dasharray: 1 .8; }
svg.plant .truck { fill: var(--panel-2); stroke: var(--proc); stroke-width: .4; }
svg.plant .truck.load { fill: var(--fill-run); }
svg.plant .truck.prob { stroke: var(--p2); stroke-width: .9; }
svg.plant .rail { stroke: var(--proc); stroke-width: .4; }
svg.plant .gd { stroke: var(--proc); stroke-width: .3; fill: var(--panel-2); }
svg.plant .gd.l1 { fill: var(--p3); } svg.plant .gd.l2 { fill: var(--p1); }
svg.plant .gd.inh { fill: none; stroke-dasharray: .5 .4; }
svg.plant .fd { fill: none; stroke: var(--proc); stroke-width: .3; }
svg.plant .fd.on { fill: var(--p1); stroke: var(--p1); }
svg.plant .cloud { fill: var(--gas); stroke: none; }
svg.plant .fire { fill: var(--fire); opacity: .85; animation: flick .35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes flick { from { transform: scaleY(.85); } to { transform: scaleY(1.12); } }
svg.plant .spray { fill: var(--water); opacity: .7; }
svg.plant .crew { fill: var(--accent); stroke: var(--panel); stroke-width: .3; }
svg.plant .crew-l { fill: var(--accent); font-size: 2.4px; font-weight: 700; }
svg.plant .psv.on { fill: var(--p1); }
svg.plant .psv { fill: var(--proc); }
svg.plant .wind { stroke: var(--ink-2); stroke-width: .6; fill: var(--ink-2); }
svg.plant .esdmask { fill: var(--p1); opacity: .06; }
@media (prefers-reduced-motion: reduce) { svg.plant .pipe.flow, svg.plant .fire { animation: none; } }

/* ---------- Spheres (tank farm) ---------- */
.tankcard { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px; }
.lvl { position: relative; height: 220px; border: 1px solid var(--proc); background: var(--panel-2); border-radius: 37px; overflow: hidden; }
.lvl .liq { position: absolute; left: 0; right: 0; bottom: 0; background: var(--liquid); }
.lvl .mk { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--ink-3); font-size: 9px; color: var(--ink-3); text-align: right; padding-right: 4px; font-family: var(--f-data); line-height: 1; }
.lvl .mk.hh { border-top-color: var(--p1); color: var(--p1); }
.lvl .rd { position: absolute; left: 0; right: 0; border-top: 2px solid var(--accent); }
.big { font-family: var(--f-data); font-size: 22px; font-weight: 600; line-height: 1.1; }
.big small { font-size: 12px; color: var(--ink-3); font-weight: 400; }
.spark { width: 100%; height: 34px; display: block; }
.spark path.l { fill: none; stroke: var(--ink-2); stroke-width: 1.2; }
.spark path.a { fill: var(--liquid-2); opacity: .6; }
.spark circle { fill: var(--ink); }

/* ---------- Bays ---------- */
.checks { list-style: none; padding: 0; margin: 6px 0; display: grid; gap: 2px; font-size: 12.5px; }
.checks li { display: flex; gap: 6px; align-items: baseline; }
.checks li::before { content: ''; flex: none; width: 9px; height: 9px; border: 1px solid var(--ink-3); border-radius: 50%; transform: translateY(1px); }
.checks li.ok::before { background: var(--ink-2); border-color: var(--ink-2); }
.checks li.fail { color: var(--p1); font-weight: 600; }
.checks li.fail::before { background: var(--p1); border-color: var(--p1); }
.checks li.override::before { background: var(--p2); border-color: var(--p2); }
.checks li.cur::before { border-color: var(--accent); border-width: 2px; }
.holdbox { border: 1px solid var(--p2); background: var(--panel-2); padding: 8px; border-radius: var(--r); margin: 6px 0; display: grid; gap: 6px; font-size: 13px; }
.calc { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 8px; font-size: 12.5px; display: grid; gap: 2px; }
.calc .row { justify-content: space-between; }
.progress { height: 14px; background: var(--panel-2); border: 1px solid var(--line); position: relative; border-radius: 1px; margin: 6px 0 2px; }
.progress i { position: absolute; inset: 0 auto 0 0; background: var(--liquid); }
.progress span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--f-data); font-size: 11px; }

/* ---------- Documents (gate) ---------- */
.docs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.doc { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; font-size: 13px; }
.doc h5 { margin: 0 0 4px; font-family: var(--f-display); font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
.doc .kv { margin: 0; }
.orange { display: inline-grid; grid-template-rows: 1fr 1fr; border: 2px solid #111; background: #f28c00; color: #111; font-family: var(--f-data); font-weight: 700; font-size: 15px; width: 72px; text-align: center; border-radius: 2px; }
.orange span:first-child { border-bottom: 2px solid #111; }
.flag { color: var(--p1); font-weight: 600; }

/* ---------- Side column ---------- */
.side h3 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
.att { display: grid; gap: 6px; }
.att > button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 8px; font-size: 13px; }
.att > button:hover { border-color: var(--accent); }
.att > button:focus-visible { outline: 2px solid var(--accent); }
.att i { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-3); }
.att i.p1 { background: var(--p1); } .att i.p2 { background: var(--p2); } .att i.p3 { background: var(--p3); } .att i.p4 { background: var(--p4); }
.att small { color: var(--ink-3); font-family: var(--f-data); }
.feed { display: grid; gap: 5px; font-size: 12.5px; }
.feed div { border-left: 2px solid var(--line); padding-left: 7px; }
.feed div.radio { border-left-color: var(--accent); }
.feed div.warn { border-left-color: var(--p2); }
.feed div.crit { border-left-color: var(--p1); }
.feed .t { font-family: var(--f-data); color: var(--ink-3); font-size: 11px; margin-right: 4px; }

/* ---------- Alarm summary ---------- */
.alarms { background: var(--glass); border-top: 2px solid var(--proc); height: var(--alarm-h); display: grid; grid-template-rows: auto 1fr; min-height: 0; }
.alarms.min { height: 36px; }
.alarms .ah { display: flex; gap: 10px; align-items: center; padding: 4px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.alarms .ah h3 { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }
.alarms .cnt { display: flex; gap: 4px; }
.alarms .list { overflow-y: auto; }
.alarms table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.alarms td { padding: 3px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.alarms td.desc { white-space: normal; width: 100%; }
.alarms tr { cursor: pointer; }
.alarms tr.unack td { font-weight: 600; }
.alarms tr.unack.p1 td { background: color-mix(in srgb, var(--p1) 18%, transparent); }
.alarms tr.unack.p2 td { background: color-mix(in srgb, var(--p2) 16%, transparent); }
.alarms tr.rtn td { color: var(--ink-3); }
.alarms tr.unack .pri { animation: blink 1s steps(2, start) infinite; }
@keyframes blink { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .alarms tr.unack .pri { animation: none; } }
.alarms .empty { padding: 10px 16px; color: var(--ink-3); }

/* ---------- Modal, toasts, banners ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 14, 16, .55); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow-y: auto; }
.modal { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; width: min(860px, 100%); padding: 16px 18px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.35); min-width: 0; }
.modal.wide { width: min(1080px, 100%); }
.modal-h { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-bottom: 10px; }
.modal-h h2 { font-size: 22px; }
.x { border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--ink-3); line-height: 1; }
.toasts { position: fixed; right: 16px; top: calc(var(--top-h) + 10px); display: grid; gap: 6px; z-index: 60; width: min(340px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--ink); color: var(--panel); padding: 7px 10px; border-radius: var(--r); font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.toast.warn { background: var(--p2); color: #1d1d1d; }

/* Harrowmere LPG Terminal — shared utilities.
   Every file attaches to the global LPG namespace so the game runs from file:// without a bundler. */
(function (L) {
  'use strict';

  // Seeded PRNG (mulberry32) so a shift can be replayed from its seed.
  function makeRng(seed) {
    let a = seed >>> 0;
    const next = function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    next.range = (lo, hi) => lo + (hi - lo) * next();
    next.int = (lo, hi) => Math.floor(lo + (hi - lo + 1) * next());
    next.pick = (arr) => arr[Math.floor(next() * arr.length)];
    next.chance = (p) => next() < p;
    next.gauss = () => {
      let u = 0, v = 0;
      while (u === 0) u = next();
      while (v === 0) v = next();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    };
    next.shuffle = (arr) => {
      const a2 = arr.slice();
      for (let i = a2.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        [a2[i], a2[j]] = [a2[j], a2[i]];
      }
      return a2;
    };
    return next;
  }

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  // First-order lag toward a target with time constant tau (seconds).
  const approach = (cur, target, dt, tau) => cur + (target - cur) * (1 - Math.exp(-dt / Math.max(tau, 1e-6)));

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  // Sim time t (s since shift start) to wall clock "HH:MM".
  function clock(S, t) {
    const total = Math.floor((S.startHour * 3600 + (t === undefined ? S.t : t)) % 86400);
    return pad2(Math.floor(total / 3600)) + ':' + pad2(Math.floor((total % 3600) / 60));
  }
  function clockSec(S, t) {
    const total = Math.floor((S.startHour * 3600 + (t === undefined ? S.t : t)) % 86400);
    return clock(S, t) + ':' + pad2(total % 60);
  }
  // Duration in seconds to "1h 05m" / "12m" / "45s".
  function dur(sec) {
    sec = Math.max(0, Math.round(sec));
    if (sec < 60) return sec + 's';
    const m = Math.floor(sec / 60);
    if (m < 60) return m + 'm';
    return Math.floor(m / 60) + 'h ' + pad2(m % 60) + 'm';
  }
  // Clock hour (decimal, 0-24) for sim time t.
  function hourOf(S, t) { return ((S.startHour * 3600 + (t === undefined ? S.t : t)) / 3600) % 24; }

  const fmt = {
    n0: (v) => (isFinite(v) ? Math.round(v).toLocaleString('en-GB') : '—'),
    n1: (v) => (isFinite(v) ? v.toFixed(1) : '—'),
    n2: (v) => (isFinite(v) ? v.toFixed(2) : '—'),
    n3: (v) => (isFinite(v) ? v.toFixed(3) : '—'),
    t: (kg) => (isFinite(kg) ? (kg / 1000).toFixed(2) + ' t' : '—'),
    t1: (kg) => (isFinite(kg) ? (kg / 1000).toFixed(1) + ' t' : '—'),
    kg: (kg) => (isFinite(kg) ? Math.round(kg).toLocaleString('en-GB') + ' kg' : '—'),
    pct: (f) => (isFinite(f) ? (f * 100).toFixed(1) + '%' : '—'),
    sign: (v, d) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d === undefined ? 1 : d),
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function dist(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }

  // Compass label for a meteorological direction (degrees the wind blows FROM).
  function compass(deg) {
    const pts = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
    return pts[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
  }

  L.util = { makeRng, clamp, lerp, approach, clock, clockSec, dur, hourOf, fmt, esc, dist, compass, pad2 };
})(globalThis.LPG = globalThis.LPG || {});

// ---- js/core/physics.js
/* LPG thermodynamics and vessel geometry.
   Fits are deliberately simple but anchored to published saturation data:
   propane  Psat 0°C 4.74, 15°C 7.30, 40°C 13.7, 60°C 21.2 bar abs; rho 507 kg/m3 at 15°C
   n-butane Psat 0°C 1.03, 20°C 2.08, 40°C 3.79 bar abs;            rho 583 kg/m3 at 15°C */
(function (L) {
  'use strict';
  const R = 8.314; // J/(mol K)

  const PRODUCTS = {
    propane: {
      key: 'propane', name: 'Propane', short: 'C3', mw: 44.097, rho15: 507.0, drho: -1.40,
      A: 9.859, B: 2268, lel: 2.1, uel: 9.5, cp: 2520, un: '1978', kemler: '23',
      fillRatio: 0.42, // ADR 4.3.3.2.5 max filling ratio, kg per litre of tank capacity
      ait: 470, // autoignition temperature °C
    },
    butane: {
      key: 'butane', name: 'Butane', short: 'C4', mw: 58.12, rho15: 583.0, drho: -1.10,
      A: 10.222, B: 2784, lel: 1.8, uel: 8.4, cp: 2390, un: '1011', kemler: '23',
      fillRatio: 0.51, ait: 405,
    },
  };

  // Pure-component vapour pressure, bar absolute (Clausius-Clapeyron fit).
  function psatPure(key, T) {
    const p = PRODUCTS[key];
    return Math.exp(p.A - p.B / (T + 273.15));
  }
  function rhoPure(key, T) {
    const p = PRODUCTS[key];
    return p.rho15 + p.drho * (T - 15);
  }
  // Mass fraction propane -> mole fraction propane.
  function moleFrac(wP) {
    const nP = wP / PRODUCTS.propane.mw, nB = (1 - wP) / PRODUCTS.butane.mw;
    return nP / (nP + nB);
  }
  // Bubble-point pressure of a C3/C4 mix (Raoult), bar absolute.
  function psat(wP, T) {
    const x = moleFrac(wP);
    return x * psatPure('propane', T) + (1 - x) * psatPure('butane', T);
  }
  // Liquid density with ideal volume mixing, kg/m3.
  function rhoL(wP, T) {
    return 1 / (wP / rhoPure('propane', T) + (1 - wP) / rhoPure('butane', T));
  }
  function rhoL15(wP) { return rhoL(wP, 15); }
  // Saturated vapour density, kg/m3. Compressibility from a crude linear fit.
  function rhoV(wP, T, Pabs) {
    const x = moleFrac(wP);
    const pp = x * psatPure('propane', T);
    const y = pp / Math.max(pp + (1 - x) * psatPure('butane', T), 1e-6);
    const mw = y * PRODUCTS.propane.mw + (1 - y) * PRODUCTS.butane.mw;
    const Z = Math.max(0.6, 1 - 0.012 * Pabs);
    return (Pabs * 1e5 * mw / 1000) / (Z * R * (T + 273.15));
  }
  // Volume correction factor to 15°C (API MPMS 11.2.4 / GPA TP-27 style, density-ratio form).
  function vcf(wP, T) { return rhoL(wP, T) / rhoL(wP, 15); }

  // Sphere: volume of liquid at height h (m) for radius r.
  function sphereVol(h, r) {
    h = Math.max(0, Math.min(2 * r, h));
    return Math.PI * h * h * (3 * r - h) / 3;
  }
  function sphereLevel(V, r) {
    const Vt = 4 / 3 * Math.PI * r * r * r;
    if (V <= 0) return 0;
    if (V >= Vt) return 2 * r;
    let lo = 0, hi = 2 * r;
    for (let i = 0; i < 40; i++) {
      const mid = (lo + hi) / 2;
      if (sphereVol(mid, r) < V) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }
  // Horizontal cylinder (bullet) with flat-ended approximation.
  function bulletVol(h, r, len) {
    h = Math.max(0, Math.min(2 * r, h));
    const seg = r * r * Math.acos((r - h) / r) - (r - h) * Math.sqrt(Math.max(0, 2 * r * h - h * h));
    return seg * len;
  }

  // Split a vessel's total inventory into liquid and saturated vapour (closed form).
  function partition(M, Vtot, wP, T, Pabs) {
    const rl = rhoL(wP, T), rv = rhoV(wP, T, Pabs);
    let mv = rv * (Vtot - M / rl) / (1 - rv / rl);
    mv = Math.max(0, Math.min(mv, M));
    const ml = M - mv;
    return { ml, mv, rl, rv, Vl: ml / rl, Vv: Vtot - ml / rl };
  }

  // Gas concentration at a point from a continuous release, in %LEL.
  // Simplified heavy-gas plume: Gaussian crosswind spread, near-field pooling in low wind.
  function plumeLEL(leak, px, py, windFromDeg, windSpeed, lelVol) {
    const Q = leak.rate;
    if (Q <= 0) return 0;
    const toRad = ((windFromDeg + 180) % 360) * Math.PI / 180; // direction gas travels
    // Plant coordinates: +x east, +y south (SVG). Compass: N = up (-y).
    const wx = Math.sin(toRad), wy = -Math.cos(toRad);
    const dx = px - leak.x, dy = py - leak.y;
    const down = dx * wx + dy * wy;
    const cross = Math.abs(dx * wy - dy * wx);
    const u = Math.max(0.8, windSpeed);
    const r2 = dx * dx + dy * dy;
    let c = 0;
    if (down > 0) {
      const sig = 0.22 * down + 1.0;
      c = 2500 * Q / (u * (0.1 + sig * sig)) * Math.exp(-(cross * cross) / (2 * sig * sig));
    }
    // Pooling / jet momentum near source, stronger when calm.
    c += 900 * Q / ((1 + 0.25 * r2) * Math.sqrt(u));
    const scale = 2.1 / lelVol; // calibrated on propane
    return Math.min(250, c * scale);
  }

  L.phys = { PRODUCTS, psatPure, rhoPure, moleFrac, psat, rhoL, rhoL15, rhoV, vcf, sphereVol, sphereLevel, bulletVol, partition, plumeLEL };
})(globalThis.LPG = globalThis.LPG || {});

        S.tanks[cfg.id] = t;
        S.tankOrder.push(cfg.id);
      }
      S.headers = {
        propane: { product: 'propane', source: 'V101', mode: 'auto', demand: 0, share: 0, idleSince: 0, pressure: 0, flow: 0 },
        butane: { product: 'butane', source: 'V103', mode: 'auto', demand: 0, share: 0, idleSince: 0, pressure: 0, flow: 0 },
      };
    },
    tick(S, dt) {
      const W = S.weather;
      for (const id of S.tankOrder) {
        const t = S.tanks[id];
        const del = tankDelugeEff(S, id);
        // Effective surroundings for the liquid surface: air + solar gain on white paint, or deluge water.
        let Teff = W.Tamb + 5.5 * W.solar - 1.5 * W.rain;
        let tauSurf = 3.2 * 3600;
        if (del > 0) { Teff = U.lerp(Teff, 17, del); tauSurf = 1800; }
        const mixing = t.inflow > 0.5 || t.outflow > 0.5;
        const tauMix = mixing ? 2400 : 6 * 3600;
        t.Ts = approach(t.Ts, Teff, dt, tauSurf);
        t.Ts = approach(t.Ts, t.Tb, dt, tauMix);
        t.Tb = approach(t.Tb, Teff, dt, 140 * 3600);
        // Fire heat input into the surface layer.
        if (t.fireQ > 0) {
          const q = t.fireQ * (1 - 0.8 * del);
          t.Ts += q * dt / (30000 * 2500);
          t.Tb += q * 0.15 * dt / (Math.max(t.ml, 1e4) * 2500);
        }
        // Shell wall in the vapour zone.
        const wallRate = t.fireQ > 0 ? 1.35 * Math.min(1.5, t.fireQ / 3e6) * (1 - 0.93 * del) : 0;
        t.wallT += wallRate * dt;
        t.wallT = approach(t.wallT, t.Ts + 5, dt, del > 0 ? 150 : 650);
        // Relief: clamp surface temperature at the set point and vent the excess as vapour.
        const Tset = t.Tset;
        if (t.Ts > Tset) {
          const excessJ = (t.Ts - Tset) * 30000 * 2500;
          const vent = excessJ / 3.6e5; // latent heat ~360 kJ/kg
          t.Ts = Tset;
          t.M -= vent;
          t.vented += vent;
          S.stats.vented += vent;
          t.psvLift = true;
          t.psvLiftT = S.t;
        } else if (t.psvLift && S.t - t.psvLiftT > 20) {
          t.psvLift = false;
        }
        tankDerived(S, t);
        // Overfill: liquid-full vessel relieves liquid through the PSV (two-phase release).
        if (t.fill > 0.975 && !t.overfilled) {
          t.overfilled = true;
          S.stats.incidents++;
          sim.log(S, 'safety', t.tag + ' LIQUID FULL — relief valve discharging two-phase LPG from the vent stack.', 'crit');
          sim.score(S, 'safety', -45, t.tag + ' overfilled to liquid-full; liquid relief to atmosphere', 'Buncefield (2005): a stuck level gauge and a high-level switch that did not work let a tank overfill. The vapour cloud exploded. Independent high-high protection must never be bypassed during a receipt.');
          L.plant.addLeak(S, { x: t.x, y: t.y - t.r, zone: 'TF', src: { kind: 'tankpsv', id: t.id }, rate: 4.5, product: t.product, label: t.tag + ' PSV liquid discharge' });
        }
        if (t.fill < 0.95) t.overfilled = false;
        // Radar measurement
        const rd = t.radar;
        if (rd.fault === 'stuck') t.levelMeas = rd.stuck;
        else {
          if (rd.fault === 'drift') rd.drift += rd.driftRate * dt;
          t.levelMeas = t.level + rd.bias + rd.drift + S.rng.gauss() * 0.4;
        }
        const measVol = P.sphereVol(t.levelMeas / 1000, t.r);
        t.fillMeas = measVol / t.Vtot;
        // Independent high-high level switch (point switch, sees the true level).
        if (t.fill >= 0.90 && !t.lshhBypass && !t.lshhTrip) {
          t.lshhTrip = true;
          sim.log(S, 'safety', 'LSHH-' + id.slice(1) + ' tripped — ' + t.tag + ' inlet XV closed by the safety system.', 'crit');
          if (t.fillMeas < 0.86) {
            sim.lesson(S, 'radar-vs-switch', 'Two level instruments disagree', 'The independent high-high switch tripped but the radar shows a lower level. When the safety switch and the control gauge disagree, believe the switch until proven otherwise: the radar is probably stuck or drifting. This is exactly the failure that preceded Buncefield.');
          }
        }
        if (t.lshhTrip && t.fill < 0.87) { t.lshhTrip = false; sim.log(S, 'ops', 'LSHH-' + id.slice(1) + ' reset — level below switch.'); }
        // Alarms from the radar (control system) except the independent switch.
        const tag = t.tag;
        sim.setAlarm(S, 'LAH-' + id, 'LAH', 'LT-' + id.slice(1), t.fillMeas > 0.85 && t.fillMeas <= 0.90, (t.fillMeas * 100).toFixed(1) + '%');
        sim.setAlarm(S, 'LAHH-' + id, 'LAHH', 'LT-' + id.slice(1), t.fillMeas > 0.90, (t.fillMeas * 100).toFixed(1) + '%');
        sim.setAlarm(S, 'LSHH-' + id, 'LSHH', 'LSHH-' + id.slice(1), t.lshhTrip);
        sim.setAlarm(S, 'LAL-' + id, 'LAL', 'LT-' + id.slice(1), t.fillMeas < 0.10 && t.fillMeas >= 0.05);
        sim.setAlarm(S, 'LALL-' + id, 'LALL', 'LT-' + id.slice(1), t.fillMeas < 0.05);
        sim.setAlarm(S, 'PAH-' + id, 'PAH', 'PT-' + id.slice(1), t.P > t.pah, t.P.toFixed(2) + ' barg');
        sim.setAlarm(S, 'PSV-' + id, 'PSV', 'PSV-' + id.slice(1), t.psvLift);
        sim.setAlarm(S, 'TAH-' + id, 'TAH', 'TT-' + id.slice(1), t.Ts > 38);
        sim.setAlarm(S, 'WALL-' + id, 'WALL', 'TW-' + id.slice(1), t.wallT > 250, Math.round(t.wallT) + ' °C');
        if (t.psvLift && !t.psvLogged) {
          t.psvLogged = true;
          sim.score(S, 'safety', -8, tag + ' relief valve lifted — LPG vented to atmosphere', 'A lifting PSV means the vessel is at its pressure limit. On a sphere that is almost always heat input: sun on an overfull vessel or fire. Deluge cools the shell and stops the lift.');
        }
        if (!t.psvLift) t.psvLogged = false;
        // BLEVE: unwetted shell weakened by fire while under pressure.
        if (t.wallT > 560 && t.P > 0.35 * t.design) {
          S.stats.incidents++;
          sim.log(S, 'safety', tag + ' SHELL FAILURE — BLEVE. Fireball and fragments across the terminal.', 'crit');
          sim.score(S, 'safety', -100, tag + ' BLEVE', 'Feyzin (1966) and San Juanico (1984): spheres exposed to fire without enough cooling failed catastrophically. Cooling water on the vapour-space shell and isolating the fuel are the only defences.');
          sim.endShift(S, 'BLEVE of ' + tag, 'catastrophe');
          return;
        }
        t.inflow = 0; t.outflow = 0;
      }
    },
  });

  // ===================================================================================
  // Pumps and loading headers
  // ===================================================================================
  sim.register({
    name: 'pumps', order: 20,
    init(S) {
      S.pumps = {};
      for (const cfg of D.PUMPS) {
        S.pumps[cfg.id] = {
          id: cfg.id, tag: cfg.tag, product: cfg.product, x: cfg.x, y: cfg.y, cap: cfg.cap,
          running: false, autoStarted: false, tripped: false, tripCause: '', loto: false, isolated: false,
          flow: 0, recirc: 0, dP: 0, amps: 0, vib: 1.6 + S.rng.range(0, 0.6), wear: S.rng.range(0, 0.08),
          wearRate: 0, seal: 'ok', sealWear: 0, sealRate: 0, hours: S.rng.int(2000, 31000), duty: cfg.id.endsWith('A'),
        };
      }
    },
    tick(S, dt) {
      for (const prod of ['propane', 'butane']) {
        const H = S.headers[prod];
        const src = S.tanks[H.source];
        const pumps = Object.values(S.pumps).filter((p) => p.product === prod);
        const srcOK = src && outletOpen(S, src) && src.fill > 0.05;
        const permissive = (p) => !p.loto && !p.tripped && !p.isolated && powerOK(S) && !esdActive(S, 'PA') && srcOK;
        // Trips
        for (const p of pumps) {
          if (!p.running) continue;
          let cause = null;
          if (!powerOK(S)) cause = 'power dip';
          else if (esdActive(S, 'PA')) cause = 'ESD';
          else if (!srcOK) cause = src && src.fill <= 0.05 ? 'low-low suction level' : 'suction valve closed';
          else if (p.vib > 11) cause = 'vibration high-high';
          if (cause) {
            p.running = false;
            if (cause !== 'ESD') { p.tripped = cause !== 'suction valve closed'; p.tripCause = cause; }
            sim.log(S, 'ops', p.tag + ' stopped — ' + cause + '.', cause === 'ESD' ? 'info' : 'warn');
          }
        }
        // Demand from bays
        let demand = 0;
        for (const b of S.bays) if (b.product === prod && b.wantFlow > 0) demand += b.wantFlow;
        H.demand = demand;
        let run = pumps.filter((p) => p.running);
        if (H.mode === 'auto') {
          if (demand > 0) {
            H.idleSince = S.t;
            const capNow = run.reduce((s, p) => s + p.cap, 0);
            if (run.length === 0 || capNow < demand * 0.98) {
              const cand = pumps.filter((p) => !p.running && permissive(p)).sort((a, b) => (b.duty ? 1 : 0) - (a.duty ? 1 : 0))[0];
              if (cand && (run.length === 0 || capNow < demand)) {
                cand.running = true; cand.autoStarted = true; cand.startT = S.t;
                sim.log(S, 'ops', cand.tag + ' started on rack demand (' + Math.round(demand) + ' m³/h).');
                run = pumps.filter((p) => p.running);
              }
            }
          } else if (run.length && S.t - H.idleSince > 600) {
            for (const p of run) if (p.autoStarted) { p.running = false; p.autoStarted = false; sim.log(S, 'ops', p.tag + ' stopped — no rack demand for 10 min.'); }
            run = pumps.filter((p) => p.running);
          }
        }
        // NPSH margin from suction vessel level.
        const npsh = src ? clamp((src.fill - 0.05) / 0.09, 0, 1) : 0;
        let cap = 0;
        for (const p of run) cap += p.cap * (0.55 + 0.45 * npsh) * (1 - 0.35 * p.wear);
        H.share = demand > 0 ? Math.min(1, cap / demand) : 0;
        const delivered = demand * H.share;
        H.flow = delivered;
        for (const p of pumps) {
          if (p.running) {
            const q = run.length ? delivered / run.length : 0;
            p.flow = q;
            p.recirc = Math.max(0, 25 - q);
            const frac = (q + p.recirc) / p.cap;
            p.dP = (prod === 'propane' ? 6.4 : 5.6) * (1 - 0.28 * frac * frac);
            p.amps = 38 + 118 * frac + S.rng.gauss() * 0.6;
            const cav = (1 - npsh) * 7.5;
            p.wear = clamp(p.wear + p.wearRate * dt, 0, 1);
            p.vib = approach(p.vib, 1.8 + p.wear * 10 + cav + Math.abs(S.rng.gauss()) * 0.25, dt, 40);
            p.hours += dt / 3600;
            if (npsh < 0.5) sim.lesson(S, 'npsh', 'Cavitation and suction level', 'Centrifugal pumps need enough liquid head above the impeller (NPSH). As a sphere empties, the margin collapses and vapour bubbles form and implode in the pump — that rattle is cavitation. Swap the header to a fuller vessel before the low-low trip.');
          } else {
            p.flow = 0; p.recirc = 0; p.dP = 0; p.amps = 0;
            p.vib = approach(p.vib, 0.2, dt, 30);
          }
          // Seal degradation (latent fault): weep -> leak.
          if (p.sealRate > 0 && p.seal !== 'leak') {
            p.sealWear += p.sealRate * dt * (p.running ? 1 : 0.3);
            if (p.sealWear > 0.5 && p.seal === 'ok') p.seal = 'weep';
            if (p.sealWear >= 1) {
              p.seal = 'leak';
              if (!p.isolated) L.plant.addLeak(S, { x: p.x, y: p.y + 2, zone: 'PA', src: { kind: 'pump', id: p.id }, rate: S.rng.range(0.06, 0.18), product: prod, label: p.tag + ' mechanical seal' });
            }
          }
          sim.setAlarm(S, 'VAH-' + p.id, 'VAH', 'VT-' + p.tag.slice(2), p.running && p.vib > 7.1 && p.vib <= 11, p.vib.toFixed(1) + ' mm/s');
          sim.setAlarm(S, 'VAHH-' + p.id, 'VAHH', 'VT-' + p.tag.slice(2), p.tripped && p.tripCause === 'vibration high-high');
          sim.setAlarm(S, 'SEAL-' + p.id, 'SEAL', 'PS-' + p.tag.slice(2), p.seal === 'leak' && !p.isolated);
          sim.setAlarm(S, 'PTRIP-' + p.id, 'PTRIP', p.tag, p.tripped && p.tripCause !== 'vibration high-high');
        }
        H.pressure = src ? src.P + (run.length ? Math.max(...run.map((p) => p.dP)) : 0) : 0;
        if (src && delivered > 0) src.outflow += delivered;
      }
    },
  });

  // ===================================================================================
  // Leaks, gas detection, ignition, fires
  // ===================================================================================
  function addLeak(S, o) {
    const lk = {
      id: (S.leakSeq = (S.leakSeq || 0) + 1), x: o.x, y: o.y, zone: o.zone, src: o.src, rate: o.rate * 0.4, rate0: o.rate,
      product: o.product || 'propane', label: o.label, t0: S.t, residual: o.residual || 60, ignited: false, total: 0, fieldFix: !!o.fieldFix, fixed: false,
    };
    S.leaks.push(lk);
    sim.log(S, 'safety', 'Loss of containment started: ' + lk.label + ' (not yet visible to operator).', 'hidden');
    return lk;
  }
  function leakFed(S, lk) {
    const s = lk.src;
    if (lk.fixed) return false;
    switch (s.kind) {
      case 'bay': { const b = S.bays.find((x) => x.id === s.id); return !!b && b.flowing; }
      case 'pump': { const p = S.pumps[s.id]; return !!p && !p.isolated; }
      case 'manifold': { const t = S.tanks[s.id]; return !!t && outletOpen(S, t); }
      case 'rail': { return L.rail ? L.rail.leakFed(S, s.id) : false; }
      case 'tankpsv': { const t = S.tanks[s.id]; return !!t && t.fill > 0.955; }
      case 'truckpsv': { const tr = S.trucks.find((x) => x.id === s.id); return !!tr && tr.psvLift && tr.state !== 'GONE' && !!tr.pos; }
      case 'field': return true; // needs a field operator to isolate
      default: return false;
    }
  }
  function ignite(S, lk, cause) {
    if (lk.ignited) return;
    lk.ignited = true;
    S.stats.incidents++;
    const fire = { id: lk.id, x: lk.x, y: lk.y, zone: lk.zone, leakId: lk.id, size: lk.rate, t0: S.t, cause, label: lk.label };
    S.fires.push(fire);
    sim.log(S, 'safety', 'IGNITION — ' + lk.label + ' (' + cause + '). ' + (lk.rate > 0.3 ? 'Jet fire.' : 'Flash fire back to the source, now burning as a jet fire.'), 'crit');
    sim.score(S, 'safety', -25, 'Gas release ignited at ' + lk.label + ' (' + cause + ')', 'Ignition needs fuel, air and an ignition source. Operators control the fuel (isolate fast) and the ignition sources (stop hot work, vehicles, non-rated equipment) while the gas detectors buy time.');
    // Flash fire: anyone inside the flammable cloud is harmed.
    for (const c of S.crew) {
      if (lelAt(S, c.x, c.y) > 60 || U.dist(c.x, c.y, lk.x, lk.y) < 6) {
        L.crewMod && L.crewMod.injure(S, c, 'caught in flash fire at ' + lk.label);
      }
    }
    for (const b of S.bays) {
      const tr = b.truckId && S.trucks.find((x) => x.id === b.truckId);
      if (tr && !tr.driverEvacuated && tr.state === 'AT_BAY' && (lelAt(S, b.x, b.y + 4) > 50 || U.dist(b.x, b.y, lk.x, lk.y) < 5)) {
        tr.driverEvacuated = true;
        S.stats.injuries = (S.stats.injuries || 0) + 1;
        sim.score(S, 'safety', -30, 'Driver of ' + tr.plate + ' burned in flash fire at ' + b.tag, 'Drivers must leave the bay on a gas alarm. Sound the bay alarm and stop loading at the first detector, not the second.');
        sim.log(S, 'safety', 'Driver of ' + tr.plate + ' injured at ' + b.tag + '. Ambulance requested.', 'crit');
      }
    }
    for (const pm of S.permits) {
      if (pm.status === 'active' && pm.loc && U.dist(pm.loc.x, pm.loc.y, lk.x, lk.y) < 30) {
        S.stats.injuries = (S.stats.injuries || 0) + 1;
        sim.score(S, 'safety', -30, 'Contractor working under ' + pm.no + ' injured by the fire', 'Live permits in an area with a gas alarm must be suspended and the workers withdrawn immediately.');
        pm.status = 'suspended';
      }
    }
    sim.requestPause(S, 'Fire at ' + lk.label);
  }

  sim.register({
    name: 'firegas', order: 40,
    init(S) {
      S.leaks = []; S.fires = [];
      S.gd = D.GAS_DET.map((d) => ({ id: d.id, tag: d.tag, zone: d.zone, x: d.x, y: d.y, lel: 0, inhibited: false, fault: false, why: '' }));
      S.fd = D.FLAME_DET.map((d) => ({ id: d.id, tag: d.tag, zone: d.zone, x: d.x, y: d.y, fire: false, inhibited: false }));
      S.confirmed = { gas: {}, fire: {} };
    },
    tick(S, dt) {
      const W = S.weather;
      // --- Leaks
      for (const lk of S.leaks) {
        const fed = leakFed(S, lk);
        lk.fed = fed;
        if (fed) lk.rate = approach(lk.rate, lk.rate0, dt, 60);
        else {
          // Trapped inventory bleeds down.
          // Trapped inventory bleeds down roughly exponentially.
          lk.rate = lk.residual > 0.5 ? Math.min(lk.rate, lk.residual / 30) : 0;
          lk.residual = Math.max(0, lk.residual - lk.rate * dt);
        }
        const kg = lk.rate * dt;
        lk.total += kg;
        S.stats.vented += kg;
        // Take released mass from the vessel it came from where we can.
        if (lk.src.kind === 'manifold' || lk.src.kind === 'tankpsv') S.tanks[lk.src.id].M -= kg;
        else if (lk.src.kind === 'truckpsv') {
          const tr = S.trucks.find((x) => x.id === lk.src.id);
          if (tr) { tr.content = Math.max(0, tr.content - kg); if (tr.pos) { lk.x = tr.pos.x; lk.y = tr.pos.y - 3; } }
        }
        else if (lk.src.kind === 'pump') { const tk = S.tanks[S.headers[S.pumps[lk.src.id].product].source]; if (tk) tk.M -= kg; }
        // A driver standing at the bay smells or hears a leak on the arm.
        if (lk.src.kind === 'bay' && !lk.reported && S.t - lk.t0 > 240 && lk.rate > 0.01) {
          const b = S.bays.find((x) => x.id === lk.src.id);
          if (b && b.truckId) {
            lk.reported = true; lk.seen = true;
            sim.log(S, 'rack', b.tag + ': driver reports a hissing sound and strong gas smell at the liquid arm swivel.', 'warn');
          }
        }
        // First discovery messages
        if (!lk.seen) {
          const near = S.gd.some((g) => !g.inhibited && g.lel > 10 && U.dist(g.x, g.y, lk.x, lk.y) < 40);
          if (near) lk.seen = true;
        }
      }
      // --- Ignition
      for (const lk of S.leaks) {
        if (lk.ignited || lk.rate < 0.005) continue;
        let p = 0.00001 * Math.sqrt(lk.rate) * S.diff.faultMult;
        for (const src of ignitionSources(S)) {
          const c = lelAt(S, src.x, src.y);
          if (c > 55) p += 0.012 * (src.strength || 1);
          else if (c > 30) p += 0.0015 * (src.strength || 1);
        }
        if (S.rng.chance(p * dt)) ignite(S, lk, ignitionCause(S, lk));
      }
      // --- Fires
      for (const f of S.fires) {
        const lk = S.leaks.find((x) => x.id === f.leakId);
        f.size = lk ? lk.rate : 0;
        if (!lk || lk.rate < 0.004) {
          f.out = (f.out || 0) + dt;
        }
      }
      for (const f of S.fires.slice()) {
        if (f.out > 45) {
          S.fires.splice(S.fires.indexOf(f), 1);
          sim.log(S, 'safety', 'Fire at ' + f.label + ' is out — fuel exhausted after isolation.', 'warn');
          sim.lesson(S, 'gasfire', 'Let a gas fire burn until the fuel is isolated', 'Extinguishing a jet fire while the gas is still flowing creates an unignited cloud that can re-ignite explosively. The rule is: isolate the source, cool the exposures, and let the fire burn out.');
        }
      }
      // Remove dead leaks
      for (const lk of S.leaks.slice()) {
        if (lk.rate <= 0 && !lk.fed) {
          S.leaks.splice(S.leaks.indexOf(lk), 1);
          sim.log(S, 'ops', 'Release at ' + lk.label + ' has stopped (' + Math.round(lk.total) + ' kg released).');
        }
      }
      // Fire heat on tanks and trucks
      for (const id of S.tankOrder) S.tanks[id].fireQ = 0;
      for (const f of S.fires) {
        if (f.out) continue;
        const MW = f.size * 46; // heat release
        for (const id of S.tankOrder) {
          const t = S.tanks[id];
          const gap = U.dist(f.x, f.y, t.x, t.y) - t.r;
          if (gap < 14) t.fireQ += MW * 1e6 * 0.09 * clamp(1 - gap / 14, 0.1, 1) + 1.5e6 * clamp(1 - gap / 14, 0, 1);
        }
        for (const tr of S.trucks) {
          if (!tr.pos || tr.state === 'GONE') continue;
          const gap = U.dist(f.x, f.y, tr.pos.x, tr.pos.y);
          if (gap < 12) tr.fireQ = (tr.fireQ || 0) + MW * 1e6 * 0.08 * clamp(1 - gap / 12, 0.1, 1) + 1e6;
        }
      }
      // --- Gas detectors
      for (const g of S.gd) {
        const c = lelAt(S, g.x, g.y);
        g.lel = g.fault ? 0 : clamp(c + Math.abs(S.rng.gauss()) * 0.4, 0, 100);
        const live = !g.inhibited && !g.fault;
        sim.setAlarm(S, 'GDL-' + g.id, 'GDLOW', g.tag, live && g.lel >= 20 && g.lel < 40, Math.round(g.lel) + '% LEL');
        sim.setAlarm(S, 'GDH-' + g.id, 'GDHIGH', g.tag, live && g.lel >= 40, Math.round(g.lel) + '% LEL');
        sim.setAlarm(S, 'GDF-' + g.id, 'GDFAULT', g.tag, g.fault);
        sim.setAlarm(S, 'GDI-' + g.id, 'INHIBIT', g.tag, g.inhibited);
      }
      // Confirmed gas: 2ooN at 40% LEL per zone -> automatic area ESD.
      for (const z of ['TF', 'PA', 'LR', 'RL']) {
        const n = S.gd.filter((g) => g.zone === z && !g.inhibited && !g.fault && g.lel >= 40).length;
        const conf = n >= 2;
        if (conf && !S.confirmed.gas[z]) {

      case 'placard': tr.product = 'propane'; tr.docs.un = '1011'; tr.docs.tankCode = 'P10BN'; tr.docs.approvedFor = 'UN 1011 only'; tr.docs.lastProduct = 'Butane UN 1011'; break;
      case 'extinguisher': tr.docs.ext6 = false; break;
      case 'noBooking': tr.booked = false; tr.orderRef = 'none quoted'; break;
      case 'lastProduct': tr.docs.lastProduct = 'Propylene UN 1077'; tr.docs.purgeCert = null; tr.product = 'propane'; break;
      case 'tyres': tr.docs.tyres = 'Nearside trailer axle 2: sidewall bulge'; break;
      default: break;
    }
  }

  // ---------------------------------------------------------------------------------
  function setState(S, tr, st) { tr.state = st; tr.stateT = S.t; }
  function truckPos(S, tr) {
    const Pt = D.POINTS;
    const prog = (dur) => clamp((S.t - tr.stateT) / dur, 0, 1);
    const lerpP = (a, b, f) => ({ x: U.lerp(a.x, b.x, f), y: U.lerp(a.y, b.y, f) });
    const bayP = (id) => { const b = S.bays.find((x) => x.id === id); return { x: b.x, y: b.y }; };
    const parkP = (i) => ({ x: Pt.park.x, y: Pt.park.y + (i % 6) * 10 });
    const qIdx = S.trucks.filter((x) => x.state === 'QUEUE').indexOf(tr);
    switch (tr.state) {
      case 'QUEUE': return { x: 274 + Math.min(qIdx, 1) * 10, y: 166 };
      case 'TO_WB_IN': return lerpP(Pt.gate, Pt.wbIn, prog(90));
      case 'WB_IN_Q': return { x: Pt.wbIn.x + 12, y: Pt.wbIn.y + 8 };
      case 'WB_IN': return Pt.wbIn;
      case 'TO_PARK': return lerpP(Pt.wbIn, parkP(tr.parkSlot || 0), prog(60));
      case 'PARKED': case 'DECANT_WAIT': return parkP(tr.parkSlot || 0);
      case 'TO_BAY': return lerpP(parkP(tr.parkSlot || 0), bayP(tr.bay), prog(90));
      case 'AT_BAY': return bayP(tr.bay);
      case 'TO_WB_OUT': return lerpP(bayP(tr.lastBay || 1), Pt.wbOut, prog(90));
      case 'WB_OUT_Q': return { x: Pt.wbOut.x + 10, y: Pt.wbOut.y - 10 };
      case 'WB_OUT': return Pt.wbOut;
      case 'WEIGHED': return { x: 222, y: 158 };
      case 'EXITING': return lerpP({ x: 222, y: 158 }, Pt.gate, prog(60));
      case 'REJECTED': return lerpP({ x: 274, y: 166 }, { x: 296, y: 166 }, prog(60));
      default: return null;
    }
  }
  function freeParkSlot(S) {
    const used = S.trucks.filter((t) => ['TO_PARK', 'PARKED', 'DECANT_WAIT', 'TO_BAY'].includes(t.state)).map((t) => t.parkSlot);
    for (let i = 0; i < 12; i++) if (!used.includes(i)) return i;
    return 0;
  }

  // Max net the truck may take: the lower of the ADR filling limit and the legal gross weight.
  function maxNet(S, tr) {
    const fr = P.PRODUCTS[tr.docs.un === '1011' ? 'butane' : tr.product].fillRatio;
    const adr = fr * tr.capL - tr.heel;
    const gvw = tr.gvw - (tr.tare + tr.heel);
    return { adr, gvw, max: Math.min(adr, gvw), fr };
  }

  // ---------------------------------------------------------------------------------
  sim.register({
    name: 'rack', order: 30,
    init(S) {
      const r = S.rng, d = S.diff;
      S.trucks = []; S.truckSeq = 0;
      S.wb = { in: { busy: null, zero: 0 }, out: { busy: null, zero: 0 } };
      S.bays = D.BAYS.map((b) => ({
        id: b.id, tag: b.tag, x: b.x, y: b.y, product: b.product, swing: b.swing, state: 'IDLE', truckId: null,
        checks: {}, checkIdx: 0, checkT: 0, checkDur: 0, hold: null, preset: 0, delivered: 0, net: 0, flowLpm: 0, wantFlow: 0,
        flowing: false, ground: 'none', groundOverride: false, stopReason: '', odorPpm: 0, meterT: 0, meterRho: 0, suspended: false,
        changeoverT: 0, startT: 0, engineT: null, decantTarget: 0,
      }));
      // Bookings: morning-heavy profile across the shift.
      const n = d.trucks;
      const times = [];
      for (let i = 0; i < n; i++) {
        const f = i / n;
        const shaped = Math.pow(f, 1.12);
        times.push(Math.round(8 * 60 + shaped * 10.4 * 3600 + r.range(-10, 10) * 60));
      }
      const defectsPool = Object.keys(GATE_DEFECTS).filter((k) => k !== 'noBooking');
      times.sort((a, b) => a - b).forEach((slot) => {
        const lateness = r.chance(0.25) ? r.range(10, 50) * 60 : r.range(-15, 12) * 60;
        const defect = r.chance(d.defectRate) ? r.pick(defectsPool) : null;
        const tr = makeTruck(S, { slotT: slot, arrivalT: Math.max(120, slot + lateness), defect });
        if (!defect && r.chance(0.32)) tr.bayDefect = r.pick(['ground', 'leak', 'ppe', 'ground', 'leak']);
        S.trucks.push(tr);
      });
      for (let i = 0; i < d.unbooked; i++) {
        const t = r.range(1.5, 9) * 3600;
        const valid = r.chance(0.5);
        const tr = makeTruck(S, { slotT: null, arrivalT: t, booked: false, defect: valid ? null : 'noBooking' });
        tr.booked = false;
        if (valid) { tr.docs.salesNote = 'Spot order ' + tr.orderRef + ' confirmed by Sales desk at ' + U.clock(S, t - r.range(20, 90) * 60) + ' (credit approved).'; }
        S.trucks.push(tr);
      }
      S.trucks.sort((a, b) => a.arrivalT - b.arrivalT);
      // Shift target: a fraction of what the compliant booked trucks could legally carry, rounded to 5 t.
      let possible = 0;
      for (const tr of S.trucks) {
        if (tr.defect) continue;
        const mx = maxNet(S, tr).max;
        possible += tr.order === 'FULL' ? mx : Math.min(tr.order, mx);
      }
      S.target = Math.round(possible * d.targetFrac / 5000) * 5000;
    },
    tick(S, dt) {
      const W = S.weather;
      for (const tr of S.trucks) {
        const age = S.t - tr.stateT;
        switch (tr.state) {
          case 'INBOUND':
            if (S.t >= tr.arrivalT) {
              setState(S, tr, 'QUEUE');
              tr.queueT = S.t;
              sim.log(S, 'gate', tr.plate + ' (' + tr.haulier + ') arrived at the gate for ' + tr.product + (tr.booked ? ', slot ' + U.clock(S, tr.slotT) : ', NO BOOKING') + '.');
            }
            break;
          case 'QUEUE':
            if (S.t - tr.queueT > 2700 && !tr.gateComplaint) {
              tr.gateComplaint = true; S.stats.complaints++;
              sim.score(S, 'throughput', -1, tr.plate + ' kept waiting at the gate for 45 min');
            }
            break;
          case 'TO_WB_IN':
            if (age >= 90) setState(S, tr, 'WB_IN_Q');
            break;
          case 'WB_IN_Q':
            if (!S.wb.in.busy) { S.wb.in.busy = tr.id; setState(S, tr, 'WB_IN'); }
            break;
          case 'WB_IN':
            if (age >= 150) {
              tr.grossIn = Math.round((tr.tare + tr.heel + S.rng.range(-40, 60) + S.wb.in.zero) / 20) * 20;
              tr.wbInZero = S.wb.in.zero;
              S.wb.in.busy = null;
              tr.parkSlot = freeParkSlot(S);
              setState(S, tr, 'TO_PARK');
              sim.log(S, 'gate', tr.plate + ' weighed in: ' + U.fmt.kg(tr.grossIn) + ' (registered tare ' + U.fmt.kg(tr.tare) + ').');
            }
            break;
          case 'TO_PARK':
            if (age >= 60) { setState(S, tr, tr.decants ? 'DECANT_WAIT' : 'PARKED'); tr.parkedT = S.t; }
            break;
          case 'PARKED':
            if (S.t - tr.parkedT > 3600 && !tr.parkComplaint) {
              tr.parkComplaint = true; S.stats.complaints++;
              sim.score(S, 'throughput', -1, tr.plate + ' waited over an hour for a bay');
            }
            break;
          case 'TO_BAY':
            if (age >= 90) {
              const b = S.bays.find((x) => x.id === tr.bay);
              setState(S, tr, 'AT_BAY');
              startPrep(S, b, tr);
            }
            break;
          case 'TO_WB_OUT':
            if (age >= 90) setState(S, tr, 'WB_OUT_Q');
            break;
          case 'WB_OUT_Q':
            if (!S.wb.out.busy) { S.wb.out.busy = tr.id; setState(S, tr, 'WB_OUT'); }
            break;
          case 'WB_OUT':
            if (age >= 150) {
              tr.grossOut = Math.round((tr.tare + tr.content + S.rng.range(-40, 60) + S.wb.out.zero) / 20) * 20;
              tr.wbOutZero = S.wb.out.zero;
              tr.wbNet = tr.grossOut - tr.grossIn;
              S.wb.out.busy = null;
              setState(S, tr, 'WEIGHED');
              sim.log(S, 'gate', tr.plate + ' weighed out: gross ' + U.fmt.kg(tr.grossOut) + ', net ' + U.fmt.kg(tr.wbNet) + '. Awaiting release.');
              const meterNet = tr.loaded - tr.vapRet;
              const mism = Math.abs(tr.wbNet - meterNet) / Math.max(meterNet, 1);
              tr.mismatch = mism;
              sim.setAlarm(S, 'METER-' + tr.id, 'METER', 'WB/' + tr.plate, mism > 0.005 && meterNet > 2000, (mism * 100).toFixed(2) + '%');
            }
            break;
          case 'WEIGHED':
            if (age > 1800 && !tr.docComplaint) { tr.docComplaint = true; S.stats.complaints++; sim.score(S, 'throughput', -1, tr.plate + ' waited 30 min for release documents'); }
            break;
          case 'EXITING':
            if (age >= 60) {
              setState(S, tr, 'GONE');
              tr.pos = null;
            }
            break;
          case 'REJECTED':
            if (age >= 60) { setState(S, tr, 'GONE'); tr.pos = null; }
            break;
          default: break;
        }
        if (tr.state !== 'GONE' && tr.state !== 'INBOUND') tr.pos = truckPos(S, tr);
        // Truck tank thermal & relief (fire exposure or liquid-full).
        if (tr.pos && tr.content > 0) {
          const prod = tr.product;
          const fbt = S.fireBrigade.target;
          const del = tr.bay && tr.state === 'AT_BAY' ? Math.max(L.plant.delugeEff(S, 'DV301'), S.fireBrigade.onScene ? (!fbt ? 0.5 : fbt === 'LR' ? 0.8 : 0.15) : 0) : 0;
          if (tr.fireQ > 0) {
            tr.wallT += 1.6 * Math.min(1.5, tr.fireQ / 2.5e6) * (1 - 0.9 * del) * dt;
            tr.Tl += tr.fireQ * (1 - 0.8 * del) * dt / (Math.max(tr.content, 2000) * 2500 * 0.5);
          }
          tr.wallT = U.approach(tr.wallT, tr.Tl + 5, dt, del > 0 ? 120 : 500);
          tr.Tl = U.approach(tr.Tl, W.Tamb + 3 * W.solar, dt, 6 * 3600);
          const rho = P.rhoL(prod === 'propane' ? 0.975 : 0.06, tr.Tl);
          tr.liqFrac = tr.content / rho / tr.capL * 1000;
          const pAbs = P.psat(prod === 'propane' ? 0.975 : 0.06, tr.Tl);
          tr.P = pAbs - 1.013;
          const setP = tr.docs.tankCode === 'P10BN' ? 10 : 25.5;
          const lift = tr.liqFrac > 0.985 || tr.P > setP * 0.95;
          if (lift && !tr.psvLift) {
            tr.psvLift = true;
            S.stats.incidents++;
            sim.log(S, 'safety', 'Truck ' + tr.plate + ' relief valve lifting' + (tr.liqFrac > 0.985 ? ' — tank liquid-full!' : ' — overpressure.'), 'crit');
            sim.score(S, 'safety', -20, 'Truck ' + tr.plate + ' relief valve lifted (' + (tr.liqFrac > 0.985 ? 'overfilled to liquid-full' : 'overpressure') + ')', 'A tanker filled beyond its filling ratio has no vapour space left. As the liquid warms it expands until the tank is liquid-full, then pressure rises extremely fast and the relief valve lifts. At Los Alfaques (1978) an overloaded tanker with no relief valve ruptured beside a campsite.');
            if (tr.pos) L.plant.addLeak(S, { x: tr.pos.x, y: tr.pos.y - 3, zone: tr.state === 'AT_BAY' ? 'LR' : 'GT', src: { kind: 'truckpsv', id: tr.id }, rate: 0.6, product: prod, label: 'Truck ' + tr.plate + ' PSV' });
          } else if (!lift && tr.psvLift && tr.liqFrac < 0.97) tr.psvLift = false;
          sim.setAlarm(S, 'TRUCKPSV-' + tr.id, 'TRUCKPSV', tr.plate, tr.psvLift);
          if (tr.wallT > 560 && tr.P > 4) {
            S.stats.incidents++;
            sim.score(S, 'safety', -100, 'Road tanker ' + tr.plate + ' BLEVE at the rack', 'A road tanker has a thin shell and a small liquid mass. Engulfed in fire without cooling, the vapour-space shell can fail in minutes. Rack deluge exists for exactly this.');
            sim.endShift(S, 'BLEVE of road tanker ' + tr.plate, 'catastrophe');
            return;
          }
        }
        tr.fireQ = 0;
      }
      for (const b of S.bays) bayTick(S, b, dt);
    },
  });

  // ---------------------------------------------------------------------------------
  function startPrep(S, b, tr) {
    b.state = 'PREP';
    b.truckId = tr.id;
    b.checks = {};
    for (const c of CHECKS) b.checks[c.key] = 'pending';
    b.checkIdx = 0; b.checkT = S.t; b.checkDur = S.rng.range(CHECKS[0].dur[0], CHECKS[0].dur[1]);
    b.hold = null; b.delivered = 0; b.net = 0; b.preset = 0; b.ground = 'none'; b.groundOverride = false; b.stopReason = '';
    b.decant = !!tr.decantPending;
    if (b.decant) b.decantTarget = tr.decantTargetContent;
    sim.log(S, 'rack', tr.plate + ' on ' + b.tag + (b.decant ? ' to decant excess' : '') + '. Driver starting pre-load checks.');
  }

  function bayTick(S, b, dt) {
    const tr = b.truckId ? S.trucks.find((x) => x.id === b.truckId) : null;
    b.wantFlow = 0; b.flowing = false; b.flowLpm = 0;
    const W = S.weather;
    switch (b.state) {
      case 'IDLE': b.ground = 'none'; break;
      case 'CHANGEOVER':
        if (S.t - b.changeoverT >= 600) {
          b.product = b.nextProduct; b.state = 'IDLE';
          sim.log(S, 'rack', b.tag + ' changeover complete — now on ' + b.product + '.');
        }
        break;
      case 'PREP': {
        if (b.hold) break;
        if (S.muster.active || (tr && tr.driverEvacuated)) break;
        if (S.t - b.checkT < b.checkDur) break;
        const c = CHECKS[b.checkIdx];
        // Defects discovered at the relevant check.
        if (tr.bayDefect === c.key && !tr.bayDefectCleared) {
          b.checks[c.key] = 'fail';
          b.hold = holdFor(c.key, tr);
          sim.log(S, 'rack', b.tag + ': ' + b.hold.msg, 'warn');
          break;
        }
        b.checks[c.key] = 'ok';
        if (c.key === 'ground') b.ground = 'ok';
        b.checkIdx++;
        if (b.checkIdx >= CHECKS.length) {
          if (b.decant) {
            b.state = 'DECANTING';
            b.startT = S.t;
            sim.log(S, 'rack', b.tag + ': decanting ' + tr.plate + ' down to ' + U.fmt.kg(b.decantTarget) + ' content.');
          } else {
            b.state = 'READY';
            sim.log(S, 'rack', b.tag + ': pre-load checks complete for ' + tr.plate + '. Awaiting preset and authorisation.');
          }
        } else {
          b.checkT = S.t; b.checkDur = S.rng.range(CHECKS[b.checkIdx].dur[0], CHECKS[b.checkIdx].dur[1]);
        }
        break;
      }
      case 'READY': break;
      case 'LOADING': {
        const H = S.headers[b.product];
        const src = S.tanks[H.source];
        // Interlocks
        if (b.ground !== 'ok' && !b.groundOverride) { stopBay(S, b, 'ground permissive lost'); break; }
        if (!L.plant.iaOK(S)) { stopBay(S, b, 'instrument air — arm valves closed'); break; }
        if (L.plant.esdActive(S, 'LR')) { stopBay(S, b, 'ESD'); break; }
        if (tr.driverEvacuated) { stopBay(S, b, 'driver left the bay'); break; }
        const remaining = b.preset - b.net;
        if (remaining <= 0.5) {
          b.state = 'COMPLETE'; b.completeT = S.t;
          sim.log(S, 'rack', b.tag + ': batch complete for ' + tr.plate + ' — ' + U.fmt.kg(b.net) + ' net. Driver disconnecting.');
          break;
        }
        const maxLpm = b.product === 'propane' ? 1100 : 950;
        let f = 1;
        if (b.net < 250) f = 0.3; // low-flow start
        else if (remaining < 350) f = 0.3; // topping off
        b.wantFlow = maxLpm * f * 0.06; // m3/h
        const flowOK = src && L.plant.outletOpen(S, src) && H.share > 0;
        if (!flowOK) { b.flowLpm = 0; b.noFlowT = (b.noFlowT || 0) + dt; break; }
        b.noFlowT = 0;
        const m3h = b.wantFlow * H.share;
        b.flowLpm = m3h / 0.06;
        b.flowing = true;
        const rhoL = src.rl, rhoV = src.rv;
        let kgs = m3h / 3600 * rhoL;
        const vr = (m3h / 3600) * rhoV; // vapour displaced from truck back to sphere
        let netRate = kgs - vr;
        if (netRate * dt > remaining) { const sc = remaining / (netRate * dt); kgs *= sc; netRate *= sc; }
        const vrA = vr * (kgs / Math.max(m3h / 3600 * rhoL, 1e-9));
        b.delivered += kgs * dt;
        b.net += netRate * dt;
        tr.loaded += kgs * dt;
        tr.vapRet += vrA * dt;
        tr.content += netRate * dt;
        tr.Tl = U.lerp(tr.Tl, src.Tb, clamp(netRate * dt / Math.max(tr.content, 1), 0, 1));
        src.M -= netRate * dt;
        b.meterT = src.Tb + 0.3; b.meterRho = rhoL;
        // Odorant (propane only, 25 ppm target)
        if (b.product === 'propane') {
          const od = S.util.odor;
          const ok = !od.failed && od.level > 0.005;
          b.odorPpm = ok ? 25 + S.rng.gauss() * 0.8 : Math.max(0, (b.odorPpm || 25) * 0.9);
          if (ok) { const use = netRate * dt * 25e-6; od.level = Math.max(0, od.level - use / od.cap); od.injected += use; }
          else tr.odorShort += netRate * dt;
        } else b.odorPpm = 0;
        if (src.offspec) tr.offspecKg += netRate * dt;
        if (W.hold) tr.lightningLoaded += dt;
        // Overfill detection on the truck
        const mx = maxNet(S, tr);
        const fillRatioNow = tr.content / tr.capL;
        if (fillRatioNow > mx.fr * 1.005) {
          if (!b.overfillNoticed && S.rng.chance(0.004 * dt)) {
            b.overfillNoticed = true;
            stopBay(S, b, 'driver hit e-stop — fixed level gauge spitting liquid');
            sim.log(S, 'rack', b.tag + ': driver reports liquid at the fixed maximum level gauge on ' + tr.plate + '. Overfilled.', 'warn');
          }
        }
        sim.setAlarm(S, 'OVERFILL-' + b.id, 'OVERFILL', b.tag, fillRatioNow > mx.fr * 1.03, (fillRatioNow / mx.fr * 100).toFixed(0) + '% of permitted');
        // Engine-start event: if not stopped within 2 min the driver pulls away -> breakaway coupling.
        if (tr.engineOn) {
          if (b.engineT === null) b.engineT = S.t;
          if (S.t - b.engineT > 120 && !b.pulledAway) {
            b.pulledAway = true;
            pullAway(S, b, tr);
          }
        }
        break;
      }
      case 'STOPPED':
        if (tr.engineOn && S.t - (b.engineT || S.t) > 240 && !b.pulledAway) { b.pulledAway = true; pullAway(S, b, tr); }
        break;
      case 'DECANTING': {
        if (L.plant.esdActive(S, 'LR') || !L.plant.iaOK(S)) { stopBay(S, b, 'ESD / air'); break; }
        const H = S.headers[b.product];
        const src = S.tanks[H.source];
        if (!src || !L.plant.inletOpen(S, src)) { b.flowLpm = 0; b.decantBlocked = true; break; }
        b.decantBlocked = false;
        const kgs = 400 / 60000 * src.rl;
        const take = Math.min(kgs * dt, tr.content - b.decantTarget);
        tr.content -= take; b.net -= take; src.M += take; tr.decanted = (tr.decanted || 0) + take;
        b.flowLpm = 400; b.flowing = true;
        if (tr.content <= b.decantTarget + 0.5) {
          b.state = 'COMPLETE'; b.completeT = S.t;
          sim.log(S, 'rack', b.tag + ': decant complete for ' + tr.plate + ' (' + U.fmt.kg(tr.decanted) + ' returned to ' + src.tag + ').');
        }
        break;
      }
      case 'COMPLETE':
        if (S.t - b.completeT >= 240) {
          b.ground = 'none';
          tr.lastBay = b.id;
          tr.bay = null;
          tr.decantPending = false;
          tr.bayDefectCleared = true;
          setState(S, tr, 'TO_WB_OUT');
          sim.log(S, 'rack', tr.plate + ' disconnected from ' + b.tag + ', heading to the outbound weighbridge.');
          b.truckId = null; b.state = 'IDLE'; b.overfillNoticed = false; b.engineT = null; b.pulledAway = false;
          sim.setAlarm(S, 'OVERFILL-' + b.id, 'OVERFILL', b.tag, false);
          sim.setAlarm(S, 'ENGINE-' + b.id, 'ENGINE', b.tag, false);
        }
        break;
      default: break;
    }
    if (tr) sim.setAlarm(S, 'ENGINE-' + b.id, 'ENGINE', b.tag, !!tr.engineOn && ['LOADING', 'STOPPED', 'READY'].includes(b.state));
    sim.setAlarm(S, 'NOFLOW-' + b.id, 'NOFLOW', b.tag, b.state === 'LOADING' && (b.noFlowT || 0) > 120);
    if (b.state !== 'LOADING') b.noFlowT = 0;
    sim.setAlarm(S, 'GND-' + b.id, 'GND', b.tag, b.state === 'STOPPED' && b.stopReason === 'ground permissive lost');
    sim.setAlarm(S, 'BAYESD-' + b.id, 'BAYESD', b.tag, b.state === 'STOPPED' && /e-stop/.test(b.stopReason));
    // Lightning: loading during a lightning hold
    if (b.state === 'LOADING' && W.hold) {
      b.ltSec = (b.ltSec || 0) + dt;
      if (b.ltSec > 120 && !b.ltPen) {
        b.ltPen = true;
        sim.score(S, 'safety', -6, b.tag + ' kept loading with lightning inside 10 km', 'Stop transfers when lightning is within 10 km and wait 30 minutes after the last strike before resuming.');
      }
    } else { b.ltSec = 0; if (!W.hold) b.ltPen = false; }
  }

  function holdFor(key, tr) {
    switch (key) {
      case 'ground': return { key, msg: 'Ground monitor will not give a permissive on ' + tr.plate + ' — resistance reads 2.4 kΩ (needs < 10 Ω). Clamp is on a painted lug.', options: [['retry', 'Instruct driver to clean the lug and re-clamp'], ['override', 'Override ground permissive with key switch'], ['reject', 'Refuse to load and send the truck away']] };
