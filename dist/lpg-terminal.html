        if (t.status === 'pending' && S.t > t.dueT + (t.id === 'closegauge' ? 0 : 600)) {
          t.status = 'missed';
          sim.score(S, 'compliance', t.id === 'fwtest' ? -6 : t.id.startsWith('rounds') ? -3 : -5, 'Routine task missed: ' + t.title,
            t.id === 'fwtest' ? 'Fire pumps that are not run weekly fail when you need them. The test exists to find the fault on a quiet day.' : '');
        }
      }
      // Odorant delivery arrival
      const od = S.odorDelivery;
      if (!od.arrived && S.t >= od.t) { od.arrived = true; sim.log(S, 'gate', 'Odorant delivery (ethyl mercaptan, UN 2363) at the gate. Needs a field operator at the skid to supervise the transfer.'); }
      // Latent: flange weep -> leak
      for (const ev of S.events) {
        if (ev.kind === 'flange') {
          const tk = S.tanks[ev.id];
          if (ev.state === 'none' && S.t >= ev.weepT) { ev.state = 'weep'; }
          if (ev.state === 'weep' && S.t >= ev.leakT) {
            ev.state = 'leak';
            ev.leak = L.plant.addLeak(S, { x: tk.x + 4, y: tk.y + tk.r + 4, zone: 'TF', src: { kind: 'manifold', id: tk.id }, rate: r.range(0.08, 0.22), product: tk.product, label: tk.tag + ' outlet flange' });
          }
          if (ev.state === 'leak' && ev.leak && !S.leaks.includes(ev.leak)) { ev.state = 'stopped'; }
        }
        if (ev.kind === 'radar' && !ev.done && S.t >= ev.t) {
          ev.done = true;
          const tk = S.tanks[ev.id];
          if (!tk.radar.fault) {
            tk.radar.fault = ev.mode; tk.radar.since = S.t;
            if (ev.mode === 'stuck') tk.radar.stuck = tk.levelMeas;
            else tk.radar.driftRate = -r.range(1.5, 3) / 60; // mm/s reading low
          }
        }
        if (ev.kind === 'random' && !ev.done && S.t >= ev.t) fireRandom(S, ev);
        if (ev.kind === 'repair' && !ev.done && S.t >= ev.t) { ev.done = true; ev.fn(S); }
      }
      // Instrument repair of a flagged radar
      for (const id of S.tankOrder) {
        const tk = S.tanks[id];
        if (tk.radar.repairT && S.t >= tk.radar.repairT) {
          tk.radar.repairT = null;
          tk.radar.fault = null; tk.radar.drift = 0; tk.radar.flagged = false; tk.radar.bias = r.range(-1, 1);
          sim.log(S, 'ops', 'Vale Instruments: LT-' + id.slice(1) + ' radar repaired and verified against a manual dip. Back in service.');
        }
      }
    },
  });

  // ===================================================================================
  function loadingBay(S) {
    const b = S.bays.filter((x) => x.state === 'LOADING');
    return b.length ? S.rng.pick(b) : null;
  }
  function fireRandom(S, ev) {
    const r = S.rng;
    const retry = () => { ev.t = S.t + 120; ev.tries++; if (ev.tries > 60) ev.done = true; };
    switch (ev.what) {
      case 'groundLoss': {
        const b = loadingBay(S); if (!b) return retry();
        b.ground = 'lost';
        sim.log(S, 'rack', b.tag + ': ground monitor lost the truck — clamp knocked off its lug.', 'warn');
        break;
      }
      case 'engine': {
        const b = loadingBay(S); if (!b) return retry();
        const tr = S.trucks.find((x) => x.id === b.truckId);
        tr.engineOn = true; b.engineT = S.t;
        sim.log(S, 'rack', b.tag + ': CCTV — ' + tr.plate + ' engine running (driver wants the cab air-con).', 'warn');
        sim.lesson(S, 'engine', 'Engines and loading arms', 'A running engine is an ignition source next to the coupling, and a driver in the cab may drive off with the arms connected. Stop the transfer first, then tell the driver to switch off over the bay PA.');
        break;
      }
      case 'armLeak': {
        const b = loadingBay(S); if (!b) return retry();
        L.plant.addLeak(S, { x: b.x + 2, y: b.y - 3, zone: 'LR', src: { kind: 'bay', id: b.id }, rate: r.range(0.07, 0.2), product: b.product, label: b.tag + ' liquid arm swivel joint', residual: 25 });
        break;
      }
      case 'iaTrip': {
        const c = S.util.ia.comps.find((x) => x.running);
        if (!c) return retry();
        c.running = false; c.tripped = true; c.tripCause = 'motor overload';
        const sb = S.util.ia.comps.find((x) => x !== c);
        if (r.chance(0.5)) sb.auto = false; // standby left in manual by maintenance
        sim.log(S, 'ops', c.tag + ' instrument air compressor tripped (motor overload).' + (!sb.auto ? ' ' + sb.tag + ' is in MANUAL.' : ''), 'warn');
        break;
      }
      case 'powerDip': {
        S.util.power.ok = false; S.util.power.dipUntil = S.t + r.range(20, 70); S.util.power.lastDip = S.t;
        for (const p of Object.values(S.pumps)) if (p.running) { p.running = false; p.autoStarted = false; p.tripped = true; p.tripCause = 'power dip (undervoltage)'; }
        if (S.rail.comp.running) { S.rail.comp.running = false; }
        sim.log(S, 'ops', 'Grid voltage dip — motors tripped on undervoltage. Control system on UPS.', 'crit');
        break;
      }
      case 'odorFail': {
        if (!S.bays.some((b) => b.product === 'propane' && (b.state === 'LOADING' || b.state === 'READY' || b.state === 'PREP'))) return retry();
        S.util.odor.failed = true; S.util.odor.pump = 'failed';
        sim.log(S, 'ops', 'Odorant injection pump P-401 lost prime — injection flow zero.', 'warn');
        break;
      }
      case 'wbDrift': {
        const which = r.chance(0.5) ? 'in' : 'out';
        S.wb[which].zero = Math.round(r.range(140, 280) / 20) * 20;
        break;
      }
      case 'gdFault': {
        const g = r.pick(S.gd.filter((x) => !x.fault && !x.inhibited));
        g.fault = true;
        S.events.push({ kind: 'repair', t: S.t + r.range(1.5, 2.5) * 3600, done: false, fn: (S2) => { g.fault = false; sim.log(S2, 'ops', g.tag + ' repaired and bump-tested by Vale Instruments.'); } });
        break;
      }
      default: break;
    }
    ev.done = true;
  }
  // Weighbridge drift alarm (shown when a truck reads off zero with empty deck)
  sim.register({
    name: 'wbmon', order: 71,
    tick(S) {
      for (const k of ['in', 'out']) sim.setAlarm(S, 'WB-' + k, 'WBFAULT', k === 'in' ? 'WB-1' : 'WB-2', S.wb[k].zero !== 0 && !S.wb[k].busy, '+' + S.wb[k].zero + ' kg');
    },
  });

  // ===================================================================================
  // Field rounds & investigations
  // ===================================================================================
  function roundsFindings(S, c) {
    const out = [];
    for (const p of Object.values(S.pumps)) {
      if (p.seal === 'weep' && !p.sealReported) { p.sealReported = true; out.push({ kind: 'seal', id: p.id, text: p.tag + ': seal weeping — drips at the gland, mercaptan smell, 4% LEL on my monitor at the seal.' }); }
      if (p.wear > 0.3 && !p.wearReported) { p.wearReported = true; out.push({ kind: 'bearing', id: p.id, text: p.tag + ': drive-end bearing is noisy and hot to touch — handheld vibration ' + (1.8 + p.wear * 10).toFixed(1) + ' mm/s.' }); }
    }
    for (const ev of S.events) {
      if (ev.kind === 'flange' && ev.state === 'weep' && !ev.reported) { ev.reported = true; out.push({ kind: 'flange', id: ev.id, ev, text: S.tanks[ev.id].tag + ' outlet flange: bubbles on a soap test at the gasket, 6% LEL at the flange face. Bolts look slack.' }); }
    }
    for (const id of S.tankOrder) {
      const tk = S.tanks[id];
      if (tk.radar.fault && !tk.radar.flagged && !tk.radar.reported && S.rng.chance(0.5)) { tk.radar.reported = true; out.push({ kind: 'radar', id, text: tk.tag + ': local magnetic gauge reads ' + Math.round(tk.level) + ' mm but the DCS shows ' + Math.round(tk.levelMeas) + ' mm.' }); }
    }
    for (const lk of S.leaks) {
      if (lk.rate > 0.005 && !lk.found && !lk.ignited) {
        lk.found = true; lk.seen = true;
        const how = { bay: 'stop the bay to isolate it', pump: 'stop and isolate the pump', manifold: 'close the sphere outlet ROSOV', rail: 'close the car valves', field: 'send me back to shut the manual block valve', tankpsv: 'stop the receipt', truckpsv: 'cool the truck' }[lk.src.kind] || 'isolate it';
        out.push({ kind: 'leak', leakId: lk.id, text: 'LEAK at ' + lk.label + ' — hissing, frost on the fitting, ' + Math.round(L.plant.lelAt(S, lk.x + 1, lk.y + 1)) + '% LEL right beside it. Recommend we ' + how + '.' });
      }
    }
    if (S.fw.diesel.failLatent && !S.fw.diesel.reported && S.rng.chance(0.3)) { S.fw.diesel.reported = true; out.push({ kind: 'diesel', text: 'P-502 diesel fire pump: battery charger showing a fault light. Might not crank.' }); }
    return out;
  }
  sim.action('crewRounds', (S) => {
    const t = S.tasks.find((x) => x.id.startsWith('rounds') && x.status === 'pending' && S.t >= x.startT - 1800);
    return L.crewMod.dispatch(S, null, {
      kind: 'rounds', label: 'Plant walk-down (rounds)', x: 80, y: 66, work: 40 * 60,
      done: (S2, c) => {
        const f = roundsFindings(S2, c);
        if (!f.length) sim.radio(S2, c.call, 'Rounds complete. Nothing abnormal. Fire extinguishers, eyewash and deluge valves checked.');
        else {
          sim.radio(S2, c.call, 'Rounds complete — ' + f.length + ' finding' + (f.length > 1 ? 's' : '') + ':');
          for (const x of f) { sim.radio(S2, c.call, x.text); S2.findings.push(Object.assign({ t: S2.t, status: 'open' }, x)); }
          sim.score(S2, 'safety', +2 * f.length, 'Rounds found ' + f.length + ' latent defect' + (f.length > 1 ? 's' : ''), 'Walk-downs exist to find the small problem before it becomes the big one: a weep before a leak, a noisy bearing before a trip.');
          S2.stats.nearMisses += f.length;
        }
        if (t) complete(S2, t.id);
      },
    });
  });
  function investigateReport(S, c, x, y, label) {
    const lk = S.leaks.filter((l) => U.dist(l.x, l.y, x, y) < 25 && l.rate > 0.002).sort((a, b) => U.dist(a.x, a.y, x, y) - U.dist(b.x, b.y, x, y))[0];
    if (lk) {
      lk.seen = true; lk.found = true;
      let advice = '';
      switch (lk.src.kind) {
        case 'bay': advice = 'Stop that bay — it isolates at the arm valves.'; break;
        case 'pump': advice = 'Stop the pump and close its suction and discharge MOVs.'; break;
        case 'manifold': advice = 'Close the sphere outlet ROSOV to isolate.'; break;
        case 'rail': advice = 'The car valve needs closing by hand.'; break;
        case 'field': advice = 'I can isolate it locally with the manual block valve if you send me back.'; break;
        default: advice = '';
      }
      sim.radio(S, c.call, 'Found it: ' + lk.label + ', I can hear it hissing — about ' + (lk.rate < 0.1 ? 'a small' : lk.rate < 0.4 ? 'a significant' : 'a large') + ' release. ' + advice);
      return;
    }
    const f = roundsFindings(S, c);
    if (f.length) { for (const x of f) { sim.radio(S, c.call, x.text); S.findings.push(Object.assign({ t: S.t, status: 'open' }, x)); } return; }
    sim.radio(S, c.call, 'At ' + label + '. Nothing found — no smell, monitor reads zero. Could be a detector fault.');
  }
  sim.action('fixFinding', (S, idx) => {
    const f = S.findings[idx];
    if (!f || f.status !== 'open') return { ok: false };
    if (f.kind === 'flange') {
      const tk = S.tanks[f.id];
      if (L.plant.outletOpen(S, tk)) return { ok: false, msg: 'Close the ' + tk.tag + ' outlet ROSOV first (line it out of service) — the flange must be isolated before re-tightening.' };
      return L.crewMod.dispatch(S, null, { kind: 'repair', label: 'Re-tighten ' + tk.tag + ' outlet flange (isolated)', x: tk.x + 4, y: tk.y + tk.r + 4, work: 30 * 60, done: (S2) => { f.ev.state = 'fixed'; f.status = 'closed'; sim.log(S2, 'ops', tk.tag + ' outlet flange re-torqued and leak tested. Line may be returned to service.'); sim.score(S2, 'safety', +3, 'Flange weep on ' + tk.tag + ' repaired before it became a leak'); } });
    }
    if (f.kind === 'seal' || f.kind === 'bearing') {
      const p = S.pumps[f.id];
      if (p.running) return { ok: false, msg: 'Stop ' + p.tag + ' (swap to the standby) before maintenance can work on it.' };
      p.loto = true; p.isolated = true;
      f.status = 'inwork';
      const end = S.t + S.rng.range(1.5, 2.5) * 3600;
      const pm = L.permits.makePermit(S, 'coldGauge', S.t);
      Object.assign(pm, { type: 'cold', title: (f.kind === 'seal' ? 'Replace mechanical seal on ' : 'Replace bearings on ') + p.tag, equip: p.id, status: 'active', startT: S.t, workEnd: end, loc: { x: p.x, y: p.y + 3, name: p.tag, zone: 'PA' }, conditions: ['contgas'], contractor: 'Stanmore Mechanical', facts: { needsGas: true, needsCond: [], blockers: [], handoverPump: p.id }, desc: 'Raised from field rounds finding.' });
      S.permits.push(pm);
      sim.log(S, 'permit', pm.no + ' raised by maintenance planner for ' + p.tag + '. Pump locked out. Close the permit when the work is complete to return it to service.');
      sim.score(S, 'safety', +2, f.kind === 'seal' ? 'Weeping seal on ' + p.tag + ' taken out of service before failure' : 'Worn bearing on ' + p.tag + ' taken out of service before a trip');
      return { ok: true, msg: p.tag + ' handed to maintenance.' };
    }
    if (f.kind === 'leak') {
      const lk = S.leaks.find((x) => x.id === f.leakId);
      if (!lk) { f.status = 'closed'; return { ok: true, msg: 'That release has already stopped.' }; }
      if (lk.src.kind === 'field') { f.status = 'closed'; return sim.actions.crewIsolateField(S, lk.id); }
      return { ok: false, msg: 'Isolate it from the control room: ' + (lk.src.kind === 'manifold' ? 'close the ' + S.tanks[lk.src.id].tag + ' outlet ROSOV.' : lk.src.kind === 'pump' ? 'stop and isolate ' + S.pumps[lk.src.id].tag + '.' : lk.src.kind === 'bay' ? 'stop the bay.' : 'stop the transfer.') };
    }
    if (f.kind === 'radar') { f.status = 'closed'; return sim.actions.gaugeFlag(S, 'opening', f.id, true, true); }
    if (f.kind === 'diesel') {
      f.status = 'closed';
      return L.crewMod.dispatch(S, null, { kind: 'repair', label: 'Replace P-502 battery charger fuse', x: D.POINTS.fwPumps.x, y: D.POINTS.fwPumps.y, work: 20 * 60, done: (S2) => { S2.fw.diesel.failLatent = false; S2.fw.diesel.failed = false; sim.log(S2, 'ops', 'P-502 battery charger repaired, batteries on charge.'); } });
    }
    return { ok: false };
  });
  sim.action('odorRestore', (S) => {
    const od = S.util.odor;
    if (!od.failed) return { ok: false, msg: 'Odorant injection is running.' };
    return L.crewMod.dispatch(S, null, { kind: 'repair', label: 'Re-prime odorant injection pump P-401', x: D.POINTS.odorant.x, y: D.POINTS.odorant.y, work: 15 * 60, done: (S2, c) => { od.failed = false; od.pump = 'running'; sim.radio(S2, c.call, 'P-401 re-primed, stroke counter running, injection back at 25 ppm.'); } });
  });
  sim.action('odorDelivery', (S) => {
    const od = S.odorDelivery;
    if (!od.arrived) return { ok: false, msg: 'The odorant delivery has not arrived yet.' };
    if (od.done || od.inProgress) return { ok: false, msg: 'Already handled.' };
    od.inProgress = true;
    return L.crewMod.dispatch(S, null, { kind: 'odor', label: 'Supervise odorant transfer at the skid', x: D.POINTS.odorant.x, y: D.POINTS.odorant.y + 3, work: 30 * 60, done: (S2, c) => { od.done = true; S2.util.odor.level = Math.min(0.95, S2.util.odor.level + 0.45); sim.radio(S2, c.call, 'Odorant transfer complete, nitrogen blanket restored, drum returned. Tank at ' + (S2.util.odor.level * 100).toFixed(0) + '%.'); complete(S2, 'odordel'); }, cancel: () => { od.inProgress = false; } });
  });
  sim.action('handoverAck', (S) => {
    if (S.handover.acked) return { ok: true };
    S.handover.acked = true;
    sim.log(S, 'ops', 'Shift handover read and signed.');
    complete(S, 'handover');
    return { ok: true };
  });
  sim.action('crewIsolateField', (S, leakId) => {
    const lk = S.leaks.find((x) => x.id === leakId);
    if (!lk) return { ok: false };
    return L.crewMod.dispatch(S, null, { kind: 'isolate', label: 'Close manual block valve at ' + lk.label, x: lk.x - 6, y: lk.y + 6, work: 5 * 60, done: (S2, c) => { lk.fixed = true; lk.residual = Math.min(lk.residual, 15); sim.radio(S2, c.call, 'Manual valve closed at ' + lk.label + '. Hissing has stopped.'); } });
  });
  sim.action('railCloseCarValves', (S, carId) => {
    const c = S.rail.cars.find((x) => x.id === carId);
    if (!c) return { ok: false };
    const pt = D.POINTS[c.spotId === 'R1' ? 'railR1' : 'railR2'];
    return L.crewMod.dispatch(S, null, { kind: 'isolate', label: 'Close internal valves on car ' + c.number, x: pt.x - 6, y: pt.y, work: 4 * 60, done: (S2, cr) => { c.valvesOpen = false; sim.radio(S2, cr.call, 'Car ' + c.number + ' internal valves closed.'); } });
  });

  // ===================================================================================
  // Gauging actions
  // ===================================================================================
  sim.action('gaugeManual', (S, which, tankId) => {
    const g = S.gauge[which];
    if (!g || g.status !== 'open') return { ok: false, msg: 'Gauge session not open.' };
    const rd = g.readings[tankId];
    if (rd.pending) return { ok: false, msg: 'Reading already requested.' };
    const tk = S.tanks[tankId];
    rd.pending = true;
    return L.crewMod.dispatch(S, null, {
      kind: 'gauge', label: 'Read local magnetic level gauge on ' + tk.tag, x: tk.x + tk.r + 2, y: tk.y + 4, work: 8 * 60,
      done: (S2, c) => {
        rd.pending = false;
        rd.manual = Math.round(tk.level + S2.rng.gauss() * 2.5);
        rd.radarAt = Math.round(tk.levelMeas);
        rd.manualTemp = Math.round((tk.Tb + S2.rng.gauss() * 0.15) * 10) / 10;
        rd.manualT = S2.t;
        sim.radio(S2, c.call, tk.tag + ' local gauge: ' + rd.manual + ' mm, thermowell ' + rd.manualTemp.toFixed(1) + ' °C.');
      },
      cancel: () => { rd.pending = false; },
    });
  });
  sim.action('gaugeFlag', (S, which, tankId, on, silent) => {
    const tk = S.tanks[tankId];
    const g = S.gauge[which];
    if (g && g.readings[tankId]) g.readings[tankId].flag = on;
    if (on && !tk.radar.flagged) {
      tk.radar.flagged = true;
      tk.radar.flagT = S.t;
      if (tk.radar.fault) {
        tk.radar.repairT = S.t + S.rng.range(1.3, 2.2) * 3600;
        S.stats.nearMisses++;
        sim.score(S, 'safety', +4, 'Faulty radar on ' + tk.tag + ' identified (' + tk.radar.fault + ')', 'Comparing the control gauge with an independent reading every shift is how stuck gauges are found. A stuck gauge during a receipt is how vessels are overfilled.');
        sim.log(S, 'ops', 'LT-' + tankId.slice(1) + ' flagged SUSPECT. Instrument work order raised — technician due ' + U.clock(S, tk.radar.repairT) + '. Treat the radar reading as unreliable until then.');
      } else {
        sim.score(S, 'compliance', -2, 'Healthy radar on ' + tk.tag + ' flagged as faulty');
        sim.log(S, 'ops', 'LT-' + tankId.slice(1) + ' flagged suspect. Instrument technician later found it within ±2 mm of a manual dip.');
        tk.radar.flagged = false;
      }
    }
    return { ok: true };
  });
  sim.action('gaugeOpenClosing', (S) => {
    if (S.gauge.closing) return { ok: true };
    S.gauge.closing = newGaugeSession(S);
    sim.log(S, 'ops', 'Closing gauge session opened.');
    return { ok: true };
  });
  sim.action('gaugeSign', (S, which) => {
    const g = S.gauge[which];
    if (!g || g.status !== 'open') return { ok: false, msg: 'Nothing to sign.' };
    if (S.tankOrder.some((id) => g.readings[id].pending)) return { ok: false, msg: 'Wait for the field readings to come back.' };
    let manualCount = 0;
    const res = {};
    for (const id of S.tankOrder) {
      const tk = S.tanks[id], rd = g.readings[id];
      if (rd.manual !== null) manualCount++;
      const useManual = rd.flag && rd.manual !== null;
      const lvl = useManual ? rd.manual : tk.levelMeas;
      const temp = useManual ? rd.manualTemp : tk.Tb + 0.1;
      const m = measuredStock(S, tk, lvl, temp);
      const truth = tk.M;
      res[id] = { calc: m, used: useManual ? 'manual' : 'radar', truth, radarErr: tk.levelMeas - tk.level };
      if (Math.abs(tk.levelMeas - tk.level) > 12 && !rd.flag && !tk.radar.flagged) {
        sim.score(S, 'compliance', -6, (which === 'opening' ? 'Opening' : 'Closing') + ' stock signed on a faulty radar for ' + tk.tag + ' (' + U.fmt.sign(tk.levelMeas - tk.level, 0) + ' mm)', 'An independent reading that disagrees with the radar by more than ~10 mm is a fault until proven otherwise. Flag it, use the manual figure for stock, and restrict receipts.');
      }
    }
    if (manualCount === 0) sim.score(S, 'compliance', -3, (which === 'opening' ? 'Opening' : 'Closing') + ' stock signed from the radar alone, with no independent check');
    g.status = 'signed'; g.signedT = S.t; g.results = res;
    const total = S.tankOrder.reduce((s, id) => s + res[id].calc.total, 0);
    g.total = total;
    if (which === 'opening') {
      S.gauge.openingStock = { t: S.t, total, dispatchedAt: S.stats.dispatched, receivedAt: S.stats.received, ventedAt: S.stats.vented };
      complete(S, 'opengauge');
      sim.log(S, 'ops', 'Opening stock signed: ' + U.fmt.t(total) + ' total LPG in spheres.');
    } else {
      const o = S.gauge.openingStock;
      if (!o) { sim.log(S, 'ops', 'Closing stock signed: ' + U.fmt.t(total) + '. No opening figure to reconcile against.', 'warn'); }
      else {
        const disp = S.stats.dispatched - o.dispatchedAt;
        const rec = S.stats.received - o.receivedAt;
        // Book: what the documents say should be in the tanks (rail receipts per shipper declarations).
        const recDeclared = S.rail.cars.filter((c) => c.received > 500).reduce((s, c) => s + Math.min(c.received, c.declared), 0);
        const book = o.total + rec - disp;
        const diff = total - book;

        go('bayHold', { title: b.tag + ': ' + opt[1].toLowerCase(), why: b.hold.msg + ' The safe answer is to fix the problem, never to override or accept it.', key: 'hold:' + b.hold.key, important: true, akey: 'hold:' + b.id + ':' + b.hold.key }, 'bayResolve', b.id, opt[0]);

      }

    }
  }

  // ---------------------------------------------------------------- Autonomy system (crew act on their own in play)
  L.sim.register({
    name: 'autonomy', order: 85,
    tick(S) {

    tex.anisotropy = 4;
    const sm = new T.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: opts.depthTest !== false });

      let wmax = 0;
      for (const r of rows) { g.font = '600 ' + r.s + 'px ' + r.f; wmax = Math.max(wmax, g.measureText(r.t).width); }

    const RING_SCALE = { valve: 1.4, truck: 4.6, car: 5.6, tank: 5.2, bay: 3.2, pump: 1.6, comp: 3, gd: 0.8, fd: 0.8, loco: 4.6 };

      h += '<h4>Stock at ' + U.clock(S, g.signedT) + '</h4><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Sphere</th><th>Source</th><th class="num">Level</th><th class="num">V obs m³</th><th class="num">T °C</th><th class="num">VCF</th><th class="num">V15 m³</th><th class="num">ρ15</th><th class="num">Liquid kg</th><th class="num">Vapour kg</th><th class="num">Total kg</th></tr></thead><tbody>';
      for (const id of S.tankOrder) {

        h += '<tr><td>' + S.tanks[id].tag + '</td><td>' + r.used + '</td><td class="num">' + F.n0(c.levelMm) + '</td><td class="num">' + c.Vobs.toFixed(2) + '</td><td class="num">' + c.tempC.toFixed(1) + '</td><td class="num">' + c.vcf.toFixed(4) + '</td><td class="num">' + c.V15.toFixed(2) + '</td><td class="num">' + c.rho15.toFixed(1) + '</td><td class="num">' + F.n0(c.mLiq) + '</td><td class="num">' + F.n0(c.mVap) + '</td><td class="num">' + F.n0(c.total) + '</td></tr>';
      }
      h += '<tr><td colspan="10"><b>Total</b></td><td class="num"><b>' + F.n0(g.total) + '</b></td></tr></tbody></table></div>';
    }
    if (which === 'closing' && S.gauge.recon) {
      const r = S.gauge.recon;
      const ok = Math.abs(r.diff) <= r.tol;
      h += '<h4>Reconciliation</h4><dl class="kv"><dt>Opening stock</dt><dd>' + F.kg(r.opening) + '</dd><dt>+ Rail receipts</dt><dd>' + F.kg(r.receipts) + '</dd><dt>− Road dispatches (weighbridge)</dt><dd>' + F.kg(r.dispatched) + '</dd><dt>= Book closing</dt><dd>' + F.kg(r.book) + '</dd><dt>Physical closing</dt><dd>' + F.kg(r.physical) + '</dd><dt>Gain / loss</dt><dd class="' + (ok ? '' : 'flag') + '">' + U.fmt.sign(r.diff / 1000, 2) + ' t (tolerance ±' + (r.tol / 1000).toFixed(2) + ' t) ' + (ok ? pill('Within tolerance', 'ok') : pill('Investigate', 'p2')) + '</dd></dl>';
    }
    return h + '</div>';
  }

  V.tanks = {
    mount(el) { el.innerHTML = '<div id="v"></div>'; },
    update(el, S) {
      let h = '<div class="sec-h"><h2>Tank farm</h2><span class="sub">Pressurised spheres · radar level, independent LSHH, local magnetic gauges</span></div><div class="grid g3">';
      for (const id of S.tankOrder) {
        const t = S.tanks[id];
        const sel = UI.sel.tank === id;
        const hh = UI.hist[id] || { lvl: [], p: [] };
        const crit = t.lshhTrip || t.psvLift || t.wallT > 250 || t.fillMeas > 0.9;
        h += '<div class="card' + (crit ? ' crit' : t.fillMeas > 0.85 || t.P > t.pah ? ' alert' : '') + '"' + (sel ? ' style="outline:2px solid var(--accent)"' : '') + '>';
        h += '<div class="row sp"><h3>' + t.tag + ' <span class="tag">' + (t.product === 'propane' ? 'Propane sphere' : 'Butane sphere') + ' · Ø ' + (t.r * 2).toFixed(1) + ' m · ' + F.n0(t.Vtot) + ' m³</span></h3>' + (t.offspec ? pill('Off-spec', 'p3') : '') + '</div>';
        h += '<div class="tankcard" style="margin-top:8px"><div class="lvl">';
        h += '<div class="liq" style="height:' + (t.levelMeas / (t.r * 20)).toFixed(1) + '%"></div>';
        const mk = (f, lbl, cls) => { const lv = P.sphereLevel(f * t.Vtot, t.r) / (2 * t.r) * 100; return '<div class="mk ' + (cls || '') + '" style="bottom:' + lv.toFixed(1) + '%">' + lbl + '</div>'; };
        h += mk(0.9, 'HH', 'hh') + mk(0.85, 'H') + mk(0.1, 'L');
        h += '</div><div class="stack">';
        h += '<div class="big">' + F.pct(t.fillMeas) + ' <small>vol · ' + F.n0(t.levelMeas) + ' mm</small></div>';
        h += '<div class="big">' + t.P.toFixed(2) + ' <small>barg · PAH ' + t.pah + ' · PSV ' + t.psv + '</small></div>';
        h += '<dl class="kv"><dt>Surface temp.</dt><dd>' + t.Ts.toFixed(1) + ' °C</dd><dt>Bulk temp.</dt><dd>' + t.Tb.toFixed(1) + ' °C</dd><dt>Liquid density</dt><dd>' + t.rl.toFixed(1) + ' kg/m³</dd>';
        h += '<dt>Composition</dt><dd>C3 ' + (t.wP * 100).toFixed(1) + '% · C4 ' + ((1 - t.wP) * 100).toFixed(1) + '%</dd>';
        h += '<dt>Liquid / vapour</dt><dd>' + F.t1(t.ml) + ' / ' + F.t1(t.mv) + '</dd><dt>Ullage to 85%</dt><dd>' + F.t1(Math.max(0, 0.85 * t.Vtot - t.Vl) * t.rl) + '</dd>';
        if (t.wallT > 60) h += '<dt>Shell (vapour zone)</dt><dd class="flag">' + Math.round(t.wallT) + ' °C</dd>';
        h += '<dt>LSHH-' + id.slice(1) + '</dt><dd>' + (t.lshhBypass ? '<span class="flag">BYPASSED</span>' : t.lshhTrip ? '<span class="flag">TRIPPED</span>' : 'healthy') + '</dd>';
        h += '<dt>Radar LT-' + id.slice(1) + '</dt><dd>' + (t.radar.flagged ? '<span class="flag">SUSPECT — WO raised</span>' : 'in service') + '</dd></dl>';
        h += '<div class="small muted">Level, last ' + U.dur(hh.lvl.length * 120) + '</div>' + spark(hh.lvl) + '<div class="small muted">Pressure</div>' + spark(hh.p);
        h += '</div></div><div class="hr"></div><div class="row">';
        const inO = L.plant.inletOpen(S, t), outO = L.plant.outletOpen(S, t);
        h += '<span class="small">XV-' + id.slice(1) + 'A inlet ' + (inO ? '<b>OPEN</b>' : '<b class="flag">SHUT</b>') + '</span>' + btn(t.xvIn ? 'Close' : 'Open', 'setTankValve', [id, 'in', !t.xvIn], 'sm quiet');
        h += '<span class="small">XV-' + id.slice(1) + 'B outlet ' + (outO ? '<b>OPEN</b>' : '<b class="flag">SHUT</b>') + '</span>' + btn(t.xvOut ? 'Close' : 'Open', 'setTankValve', [id, 'out', !t.xvOut], 'sm quiet');
        h += '</div><div class="row" style="margin-top:6px">';
        const dv = D.DELUGE.find((d) => d.covers === id);
        h += btn(S.fw.deluge[dv.id].open ? 'Stop deluge ' + dv.tag : 'Start deluge ' + dv.tag, 'deluge', [dv.id, !S.fw.deluge[dv.id].open], S.fw.deluge[dv.id].open ? 'sm warn' : 'sm quiet');
        const H = S.headers[t.product];
        h += H.source === id ? '<span class="small muted">Feeding the ' + t.product + ' loading header</span>' : btn('Line up ' + t.product + ' header', 'setHeaderSource', [t.product, id], 'sm ghost');
        h += '</div></div>';
      }
      h += '</div><div class="grid" style="margin-top:12px">' + gaugeSession(S, 'opening');
      if (S.gauge.closing) h += gaugeSession(S, 'closing');
      else h += '<div class="card"><div class="row sp"><h3>Closing gauge</h3>' + btn('Open closing gauge', 'gaugeOpenClosing', [], 'sm', { disabled: S.t < 10.5 * 3600, title: 'Available from 16:30' }) + '</div><p class="small muted">Open it in the last hour of the shift, after the last big movements, then reconcile against the opening stock.</p></div>';
      h += '</div>';
      L.ui.setHTML(el.querySelector('#v'), h);
    },
  };

  // ------------------------------------------------------------------ Loading rack
  function presetCalc(S, b, tr) {
    const mx = L.rack.maxNet(S, tr);
    const heelEst = tr.grossIn - tr.tare;
    let h = '<div class="calc"><div class="row"><b>Truck data</b><span class="muted small">for the preset</span></div>';
    h += '<div class="row"><span>Tank capacity (water)</span><span class="num">' + F.n0(tr.capL) + ' L</span></div>';
    h += '<div class="row"><span>Filling ratio (' + tr.product + ')</span><span class="num">' + P.PRODUCTS[tr.product].fillRatio.toFixed(2) + ' kg/L</span></div>';
    h += '<div class="row"><span>Registered tare</span><span class="num">' + F.kg(tr.tare) + '</span></div>';
    h += '<div class="row"><span>Gross in (weighbridge)</span><span class="num">' + F.kg(tr.grossIn) + '</span></div>';
    h += '<div class="row"><span>GVW limit</span><span class="num">' + F.kg(tr.gvw) + '</span></div>';
    h += '<div class="row"><span>Order</span><span class="num">' + (tr.order === 'FULL' ? 'FULL LOAD' : F.kg(tr.order)) + '</span></div>';
    if (S.settings.hints) {
      h += '<div class="hr"></div><div class="row"><span>Heel ≈ gross in − tare</span><span class="num">' + F.kg(heelEst) + '</span></div>';
      h += '<div class="row"><span>ADR limit = cap × ratio − heel</span><span class="num">' + F.kg(P.PRODUCTS[tr.product].fillRatio * tr.capL - heelEst) + '</span></div>';
      h += '<div class="row"><span>Weight limit = GVW − gross in</span><span class="num">' + F.kg(tr.gvw - tr.grossIn) + '</span></div>';
      const sug = Math.floor(Math.min(tr.order === 'FULL' ? Infinity : tr.order, P.PRODUCTS[tr.product].fillRatio * tr.capL - heelEst, tr.gvw - tr.grossIn) / 10) * 10 - 50;
      h += '<div class="row"><b>Suggested preset</b><b class="num">' + F.kg(sug) + '</b></div>';
    }
    return h + '</div>';
  }

  function bayCard(S, b) {
    const tr = b.truckId && S.trucks.find((x) => x.id === b.truckId);
    const sel = UI.sel.bay === b.id;
    const cls = b.hold || b.state === 'STOPPED' || S.alarms.some((a) => a.active && a.tag === b.tag && a.pri === 1) ? ' alert' : '';
    let h = '<div class="card' + cls + '"' + (sel ? ' style="outline:2px solid var(--accent)"' : '') + '><div class="row sp"><h3>' + b.tag + ' <span class="tag">' + b.product + (b.swing ? ' · swing bay' : '') + '</span></h3>' + bayPill(b) + '</div>';
    if (!tr) {
      h += '<p class="small muted">' + (b.state === 'CHANGEOVER' ? 'Changing over to ' + b.nextProduct + ' — ready at ' + U.clock(S, b.changeoverT + 600) + '.' : b.damaged ? 'Arms damaged in a drive-away. Repair before use.' : b.suspended ? 'Out of service.' : 'Free. Call a parked truck forward from Gate & weighbridge.') + '</p><div class="row">';
      if (b.swing && b.state === 'IDLE') h += btn('Change to ' + (b.product === 'propane' ? 'butane' : 'propane'), 'bayChangeover', [b.id, b.product === 'propane' ? 'butane' : 'propane'], 'sm quiet');
      if (b.damaged) h += btn('Repair arms', 'bayRepair', [b.id], 'sm warn');
      h += btn(b.suspended ? 'Return to service' : 'Take out of service', 'baySuspend', [b.id, !b.suspended], 'sm quiet', { disabled: b.state !== 'IDLE' });
      return h + '</div></div>';
    }
    h += '<dl class="kv"><dt>Truck</dt><dd>' + e(tr.plate) + ' · ' + e(tr.haulier) + '</dd><dt>Driver</dt><dd>' + e(tr.driver) + (tr.driverEvacuated ? ' <span class="flag">(evacuated)</span>' : '') + '</dd><dt>Customer</dt><dd>' + e(tr.customer) + '</dd>';
    h += '<dt>Ground</dt><dd>' + (b.groundOverride ? '<span class="flag">OVERRIDDEN</span>' : b.ground === 'ok' ? 'permissive ✓' : b.ground === 'lost' ? '<span class="flag">LOST</span>' : '—') + '</dd>';
    if (tr.engineOn) h += '<dt>Engine</dt><dd class="flag">RUNNING</dd>';
    h += '</dl>';
    if (b.state === 'PREP' || b.state === 'ARRIVING') {
      h += '<ul class="checks">';
      L.rack.CHECKS.forEach((c, i) => {
        const st = b.checks[c.key] || 'pending';
        h += '<li class="' + st + (i === b.checkIdx && st === 'pending' && b.state === 'PREP' ? ' cur' : '') + '">' + e(c.label) + '</li>';
      });
      h += '</ul>';
    }
    if (b.hold) {
      h += '<div class="holdbox"><b>' + e(b.hold.msg) + '</b>';
      for (const [k, lbl] of b.hold.options) h += btn(lbl, 'bayResolve', [b.id, k], k === 'reject' ? 'sm quiet' : k === 'override' || k === 'accept' || k === 'ignore' ? 'sm ghost' : 'sm');
      h += '</div>';
    }
    if (b.state === 'READY') {
      h += presetCalc(S, b, tr);
      const id = 'preset-' + b.id;
      h += '<div class="row" style="margin-top:6px"><label for="' + id + '" class="small">Preset (kg net)</label><input id="' + id + '" type="number" min="500" max="30000" step="10" style="width:110px" value="' + e(draft(id, '')) + '">';
      h += btn('Authorise loading', 'bayAuthorize', [b.id], '', { inputs: [id], disabled: !!S.simopsHold.LR });
      h += '</div>';
      if (S.simopsHold.LR) h += '<p class="small flag">Rack suspended under ' + S.simopsHold.LR + '.</p>';
      if (S.weather.hold) h += '<p class="small flag">Lightning stop in force until ' + U.clock(S, S.weather.lastStrike10 + 1800) + '.</p>';
      if (b.product === 'propane' && S.util.odor.failed) h += '<p class="small flag">Odorant injection failed — propane would leave unodorised.</p>';
    }
    if (['LOADING', 'STOPPED', 'COMPLETE', 'DECANTING'].includes(b.state)) {
      const mx = L.rack.maxNet(S, tr);
      const frac = U.clamp(b.net / Math.max(b.preset, 1), 0, 1);
      if (!b.decant) h += '<div class="progress"><i style="width:' + (frac * 100).toFixed(1) + '%"></i><span>' + F.n0(b.net) + ' / ' + F.n0(b.preset) + ' kg net</span></div>';
      h += '<dl class="kv">';
      h += '<dt>Flow</dt><dd>' + F.n0(b.flowLpm) + ' L/min' + (b.state === 'LOADING' && !b.flowing ? ' <span class="flag">NO FLOW</span>' : b.net < 250 ? ' (low-flow start)' : b.preset - b.net < 350 ? ' (topping)' : '') + '</dd>';
      h += '<dt>Meter liquid / vapour back</dt><dd>' + F.n0(tr.loaded) + ' / ' + F.n0(tr.vapRet) + ' kg</dd>';
      h += '<dt>Meter T / ρ</dt><dd>' + b.meterT.toFixed(1) + ' °C · ' + b.meterRho.toFixed(1) + ' kg/m³</dd>';
      if (b.product === 'propane') h += '<dt>Odorant</dt><dd' + (b.odorPpm < 17 && b.flowing ? ' class="flag"' : '') + '>' + b.odorPpm.toFixed(1) + ' ppm</dd>';
      h += '<dt>Truck content</dt><dd>' + (tr.content / tr.capL).toFixed(3) + ' kg/L (limit ' + mx.fr + ')</dd>';
      if (b.decant) h += '<dt>Decant target</dt><dd>' + F.kg(b.decantTarget) + ' content (now ' + F.kg(tr.content) + ')' + (b.decantBlocked ? ' <span class="flag">sphere inlet shut</span>' : '') + '</dd>';
      if (b.state === 'STOPPED') h += '<dt>Stopped</dt><dd class="flag">' + e(b.stopReason) + '</dd>';
      h += '</dl><div class="row" style="margin-top:6px">';
      if (b.state === 'LOADING' || b.state === 'DECANTING') h += btn('Stop', 'bayStop', [b.id], 'danger');
      if (b.state === 'STOPPED') {
        h += btn('Resume', 'bayResume', [b.id], '') + btn('End batch', 'bayFinish', [b.id], 'quiet');
        if (b.ground !== 'ok' && !b.groundOverride) h += btn('Driver: re-attach ground', 'bayReground', [b.id], 'quiet');
      }
      h += btn('Bay PA to driver', 'bayPA', [b.id], 'quiet' + (tr.engineOn ? ' warn' : ''));
      h += '</div>';
    }
    if (b.state === 'COMPLETE') h += '<p class="small muted">Driver closing valves, venting arms to vapour recovery, disconnecting.</p>';
    return h + '</div>';
  }

  V.rack = {
    mount(el) { el.innerHTML = '<div id="v"></div>'; },
    update(el, S) {
      let h = '<div class="sec-h"><h2>Loading rack</h2><span class="sub">4 bays · Coriolis metering, net of vapour return · bottom loading with dry-break couplings</span></div>';
      h += '<div class="row" style="margin-bottom:10px">' + btn('Stop all bays', 'bayStopAll', [], 'danger sm');
      for (const prod of ['propane', 'butane']) {
        const Hh = S.headers[prod];
        h += '<span class="small">' + prod + ' header: ' + S.tanks[Hh.source].tag + ' · ' + F.n0(Hh.flow) + ' / ' + F.n0(Hh.demand) + ' m³/h' + (Hh.demand > 0 && Hh.share < 0.99 ? ' <span class="flag">pump capacity short</span>' : '') + '</span>';
      }
      if (S.weather.hold) h += pill('Lightning stop', 'p2');
      if (S.simopsHold.LR) h += pill('Suspended: ' + S.simopsHold.LR, 'p3');
      h += '</div><div class="grid g2">';
      for (const b of S.bays) h += bayCard(S, b);
      h += '</div>';
      L.ui.setHTML(el.querySelector('#v'), h);
    },
  };

  // ------------------------------------------------------------------ Gate & weighbridge
  function dateStr(ms) { const d = new Date(ms); return d.getFullYear() + '-' + U.pad2(d.getMonth() + 1) + '-' + U.pad2(d.getDate()); }
  V.dateStr = dateStr;

  V.truckDocs = function (S, tr) {
    const d = tr.docs;
    const exp = (ms) => dateStr(ms) + (S.settings.hints && ms < S.date ? ' <span class="flag">EXPIRED</span>' : '');
    let h = '<p class="small muted">Today is ' + dateStr(S.date) + '. Check each document before admitting the truck.</p><div class="docs">';
    h += '<div class="doc"><h5>Driver</h5><dl class="kv"><dt>Name</dt><dd>' + e(tr.driver) + '</dd><dt>ADR training cert.</dt><dd>valid to ' + exp(d.adrDriver) + '</dd><dt>Haulier</dt><dd>' + e(tr.haulier) + '</dd></dl></div>';
    h += '<div class="doc"><h5>Vehicle</h5><dl class="kv"><dt>Registration</dt><dd>' + e(tr.plate) + '</dd><dt>Type</dt><dd>' + (tr.rigid ? 'Rigid tanker' : 'Articulated tank semi-trailer') + '</dd><dt>ADR cert. of approval</dt><dd>valid to ' + exp(d.vehicleCert) + '</dd><dt>Tank code</dt><dd>' + d.tankCode + '</dd><dt>Approved for</dt><dd>' + e(d.approvedFor) + '</dd><dt>Tank inspection due</dt><dd>' + exp(d.tankTest) + '<br><span class="muted">' + d.tankTestType + '</span></dd><dt>Capacity</dt><dd>' + F.n0(tr.capL) + ' L</dd><dt>Tare / GVW</dt><dd>' + F.kg(tr.tare) + ' / ' + F.kg(tr.gvw) + '</dd></dl></div>';
    h += '<div class="doc"><h5>Orange plate & cargo</h5><div class="row"><span class="orange"><span>' + d.kemler + '</span><span>' + d.un + '</span></span><span class="small">Hazard ID ' + d.kemler + '<br>UN ' + d.un + '</span></div><dl class="kv"><dt>Last cargo</dt><dd>' + e(d.lastProduct) + '</dd><dt>Purge certificate</dt><dd>' + (d.purgeCert ? e(d.purgeCert) : 'none presented') + '</dd></dl></div>';
    h += '<div class="doc"><h5>Booking</h5><dl class="kv"><dt>Slot</dt><dd>' + (tr.booked && tr.slotT !== null ? U.clock(S, tr.slotT) : '<b>not booked</b>') + '</dd><dt>Product</dt><dd>' + tr.product + '</dd><dt>Quantity</dt><dd>' + (tr.order === 'FULL' ? 'Full load' : F.kg(tr.order)) + '</dd><dt>Customer</dt><dd>' + e(tr.customer) + '</dd><dt>Order ref.</dt><dd>' + e(tr.orderRef) + '</dd>' + (d.salesNote ? '<dt>Sales note</dt><dd>' + e(d.salesNote) + '</dd>' : '') + '</dl></div>';
    h += '<div class="doc"><h5>Gate guard checks</h5><dl class="kv"><dt>Extinguisher 2 kg (cab)</dt><dd>' + (d.ext2 ? 'present' : '<b>missing</b>') + '</dd><dt>Extinguisher 6 kg</dt><dd>' + (d.ext6 ? 'present' : '<b>missing</b>') + '</dd><dt>Tyres</dt><dd>' + e(d.tyres) + '</dd><dt>Lights, leaks</dt><dd>no defects seen</dd></dl></div>';
    return h + '</div>';
  };

  V.gate = {
    mount(el) { el.innerHTML = '<div id="v"></div>'; },
    update(el, S) {
      let h = '<div class="sec-h"><h2>Gate & weighbridges</h2><span class="sub">Document checks · WB-1 inbound · WB-2 outbound · release</span></div>';
      const q = S.trucks.filter((t) => t.state === 'QUEUE');
      h += '<div class="grid g2"><div class="card' + (q.length ? ' alert' : '') + '"><h3>At the gate <span class="tag">' + q.length + ' waiting</span></h3>';
      if (!q.length) h += '<p class="small muted">No trucks waiting.</p>';
      else {
        h += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Truck</th><th>Product</th><th>Slot</th><th>Waiting</th><th></th></tr></thead><tbody>';
        for (const tr of q) h += '<tr><td>' + e(tr.plate) + '<div class="small muted">' + e(tr.haulier) + '</div></td><td>' + tr.product + '</td><td>' + (tr.booked ? U.clock(S, tr.slotT) : '<b>unbooked</b>') + '</td><td class="num">' + U.dur(S.t - tr.queueT) + '</td><td>' + ubtn('Inspect documents', 'modal', ['truck', tr.id], 'sm') + '</td></tr>';
        h += '</tbody></table></div>';
      }
      h += '</div>';
      // Weighbridges
      h += '<div class="card"><h3>Weighbridges</h3><dl class="kv">';
      for (const k of ['in', 'out']) {
        const wb = S.wb[k];
        const occ = wb.busy ? S.trucks.find((t) => t.id === wb.busy) : null;
        h += '<dt>' + (k === 'in' ? 'WB-1 inbound' : 'WB-2 outbound') + '</dt><dd>' + (occ ? e(occ.plate) + ' weighing' : 'empty deck') + ' · zero ' + (wb.zero ? '<span class="flag">+' + wb.zero + ' kg</span>' : '0 kg') + ' ' + btn('Zero check', 'wbZero', [k], 'sm quiet', { disabled: !!wb.busy }) + '</dd>';
      }
      const inQ = S.trucks.filter((t) => ['TO_WB_IN', 'WB_IN_Q'].includes(t.state)).length, outQ = S.trucks.filter((t) => ['TO_WB_OUT', 'WB_OUT_Q'].includes(t.state)).length;
      h += '<dt>Queues</dt><dd>' + inQ + ' inbound · ' + outQ + ' outbound</dd></dl></div></div>';
      // Parked
      const parked = S.trucks.filter((t) => t.state === 'PARKED' || t.state === 'DECANT_WAIT');
      h += '<div class="card" style="margin-top:12px"><h3>Waiting for a bay <span class="tag">' + parked.length + '</span></h3>';

      else {

  // ------------------------------------------------------------------ Audio (horn)
  let actx = null, hornGain = null, hornOsc = null, lastChimeSeq = 0;
  function audioInit() {
    if (actx) return;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      hornOsc = actx.createOscillator(); hornOsc.type = 'square';
      const filt = actx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 1800;
      hornGain = actx.createGain(); hornGain.gain.value = 0;
      hornOsc.connect(filt); filt.connect(hornGain); hornGain.connect(actx.destination);
      hornOsc.start();
    } catch (err) { actx = null; }
  }
  function audioTick() {
    if (!actx || !hornGain) return;
    const now = actx.currentTime;
    const live = S && UI.sound && !UI.paused && S.alarms.some((a) => !a.acked && a.id > (UI.silencedSeq || 0) && a.pri <= 2);
    let g = 0;
    if (live) {
      const pri = Math.min(...S.alarms.filter((a) => !a.acked && a.id > (UI.silencedSeq || 0)).map((a) => a.pri));
      const ph = (performance.now() / 1000) % (pri === 1 ? 0.5 : 1.4);
      if (pri === 1) { hornOsc.frequency.setValueAtTime(ph < 0.25 ? 880 : 660, now); g = 0.05; }
      else { hornOsc.frequency.setValueAtTime(620, now); g = ph < 0.35 ? 0.04 : 0; }
    }
    // Soft chime for new low-priority alarms
    if (S && UI.sound && S.alarmSeq > lastChimeSeq) {
      const fresh = S.alarms.filter((a) => a.id > lastChimeSeq && a.pri >= 3);
      lastChimeSeq = S.alarmSeq;
      if (fresh.length && !live) {
        const o = actx.createOscillator(), gg = actx.createGain();
        o.frequency.value = 1046; gg.gain.setValueAtTime(0.04, now); gg.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
        o.connect(gg); gg.connect(actx.destination); o.start(now); o.stop(now + 0.55);
      }
    }
    hornGain.gain.setTargetAtTime(g, now, 0.01);
  }

  // ------------------------------------------------------------------ Actions from the UI
  function readInputs(el) {
    const spec = el.getAttribute('data-in');
    if (!spec) return [];
    const out = [];
    let obj = null;
    for (const part of spec.split(',')) {
      if (part.includes(':')) {
        const [k, id] = part.split(':');
        const n = document.getElementById(id);
        obj = obj || {};
        obj[k] = n ? n.value : undefined;
      } else {
        const n = document.getElementById(part);
        out.push(n ? (n.type === 'number' ? Number(n.value) : n.value) : undefined);
      }
    }
    if (obj) out.push(obj);
    return out;
  }

      store('hmt-theme', next || 'auto');

    ack(id) { L.sim.ackAlarm(S, id); },
    ackAll() { for (const a of S.alarms.slice()) if (!a.acked) L.sim.ackAlarm(S, a.id); },
    silence() { UI.silencedSeq = S.alarmSeq; },
    alarmMin() { UI.alarmMin = !UI.alarmMin; },
    alarmGo(id) {
      const a = S.alarms.find((x) => x.id === id) || S.alarmHistory.find((x) => x.id === id);
      UI.modal = null;
      if (!a) return;
      const k = a.key;
      const tank = S.tankOrder.find((t) => k.endsWith('-' + t));
      if (tank) return UIA.nav('tanks', tank);
      if (/^(VAH|VAHH|SEAL|PTRIP|IA|POWER|OD|FW)/.test(k)) return UIA.nav('utilities');
      if (/^(GD|CONF|FD|ESD|HW)/.test(k)) return UIA.nav('fg');
      if (/^(COMP|KOPOT|CARLOW|DEMUR)/.test(k)) return UIA.nav('rail');
      if (/^(METER|WB)/.test(k)) return UIA.nav('gate');
      if (/^PERMIT/.test(k)) return UIA.nav('permits');
      const bay = S.bays.find((b) => a.tag === b.tag);
      if (bay) return UIA.nav('rack', bay.id);
      if (/^(LTNG|WIND)/.test(k)) return UIA.nav('rack');

    permitApprove(no) {
      const conds = Object.keys(L.permits.CONDITIONS).filter((k) => { const n = document.getElementById('pc-' + no + '-' + k); return n && n.checked; });
      L.sim.act(S, 'permitDecide', no, 'approve', { conditions: conds });
    },
    investigate(crewId, sid) {
      const n = document.getElementById(sid);
      const loc = V.crewLocs[+(n ? n.value : 0)];
      L.sim.act(S, 'crewInvestigate', crewId, loc[1], loc[2], loc[0]);
    },
    logFilter(k) { UI.logFilter = k; },
    addNote() {
      const n = document.getElementById('lognote');
      const v = n && n.value.trim();
      if (!v) return;
      L.sim.log(S, 'note', v);
      n.value = ''; UI.drafts.lognote = '';
      n.blur();
    },
    hb(id) { UI.hbSection = id; },
    lessonRead(id) { const l = S.lessons.find((x) => x.id === id); if (l) l.read = true; },
    newShift() { UI.modal = null; showStart(); },
    replay() { const seed = S.seed, cfg = Object.assign({}, S.cfg, { narrate: false }), pk = S.difficulty; UI.modal = null; startShift(cfg, seed, pk); },
    reviewLog() { UI.modal = null; UI.tab = 'log'; UI.reviewing = true; },
  };

  function onClick(ev) {
    const el = ev.target.closest('[data-a]');
    if (!el || el.disabled) return;
    const a = el.getAttribute('data-a');
    let args = [];
    try { args = JSON.parse(el.getAttribute('data-p') || '[]'); } catch (err) { args = []; }
    if (a.startsWith('ui:')) {
      if (!S && a !== 'ui:bgclose') return;
      const fn = UIA[a.slice(3)];
      if (fn) { if (a === 'ui:bgclose') fn(ev); else if (el === ev.target.closest('[data-a]')) fn.apply(null, args); }
    } else if (S && !S.over) {
      args = args.concat(readInputs(el));
      L.sim.act(S, a, ...args);
    }
    if (a !== 'ui:bgclose') ev.stopPropagation();
    if (S) renderAll();
  }

  function onInput(ev) {
    const t = ev.target;
    if (!t.id) return;
    if (t.tagName === 'SELECT') UI.lastSelectT = Date.now();
    UI.drafts[t.id] = t.type === 'checkbox' ? t.checked : t.value;
  }

  function onKey(ev) {
    if (!S || !UI.started) return;
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName)) return;
    if (ev.key === ' ') { ev.preventDefault(); UIA.pause(); renderAll(); }
    else if (/^[1-5]$/.test(ev.key)) { UIA.speed(SPEEDS[+ev.key - 1]); renderAll(); }
    else if (ev.key === 'Escape' && UI.modal && UI.modal.type !== 'report') { UI.modal = null; renderAll(); }
    else if (ev.key === 'Escape') { UIA.deselect(); if (UI.tab !== 'site' && W) UI.tab = 'site'; renderAll(); }
  }

  // ------------------------------------------------------------------ Loop
  let lastFrame = 0, lastRender = 0, lastSvg = 0;
  function frame(ts) {
    const dt = Math.min(0.25, (ts - (lastFrame || ts)) / 1000);
    lastFrame = ts;
    if (S && UI.started && !UI.paused && !UI.tutorHold && !S.over) {
      L.sim.tick(S, dt * UI.speed);
      if (S.pauseReq) { UI.paused = true; UI.pauseReason = S.pauseReq; S.pauseReq = null; if (UI.speed > 30) UI.speed = 30; }
      if (S.over) { UI.paused = true; UI.modal = { type: 'report' }; }
    }
    if (W) {
      if (S && UI.started) W.frame(S, dt, UI.paused || UI.tutorHold || S.over ? 0 : UI.speed);
      else if (preview) { L.sim.tick(preview, dt * 20); W.camCtl.want.yaw += dt * 0.04; W.frame(preview, dt, 20); }
      else W.frame(null, dt, 0);
    }
    if (S && UI.started && L.tutor && L.tutor.T.active) L.tutor.frame(S);
    if (S && UI.started) {
      V.recordHistory(S);
      if (ts - lastRender > 220) { lastRender = ts; renderAll(); if (UI.hoverPick) L.hud.tooltip(S, UI.hoverPick, UI.hoverX, UI.hoverY); }
      else if (UI.tab === 'overview' && ts - lastSvg > 120) { lastSvg = ts; L.plantSvg.update($('ov-plant'), S); }
      audioTick();
    }
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------ Start screen and shift settings
  const PR = D.PRESETS;
  const PRESET_ORDER = ['easy', 'normal', 'hard', 'expert'];
  let startPreset = 'easy';
  let startCfg = Object.assign({}, PR.easy);
  try { const sv = JSON.parse(store('hmt-cfg') || 'null'); if (sv && sv.cfg) { startCfg = Object.assign({}, PR.normal, sv.cfg); startPreset = sv.preset || 'custom'; } } catch (err) { /* ignore */ }
  const AUTO_TXT = { off: 'You give every order. Field operators wait for you.', field: 'Field operators do rounds, gauging, rail connections, gas tests and isolations on their own. Control-room decisions are yours.', full: 'Field operators and a CCR assistant run routine work. They bring key decisions — gate, presets, release, permits — to you for approval.' };
  const APPR_TXT = { wait: 'Key decisions wait until you answer.', timeout: 'If you have not answered in 10 minutes, the crew go ahead with their recommendation.', auto: 'The crew decide everything themselves; you watch and step in.' };
  function difficultyOf(c) {
    let p = (6 - c.crew) * 0.8 + ({ off: 3, field: 1.5, full: 0, watch: 0 }[c.autonomy] || 0) + (c.autonomy === 'full' ? ({ wait: 0.6, timeout: 0, auto: -0.5 }[c.approvals] || 0) : 0);
    p += ({ calm: 0, changeable: 1, stormy: 2.2 }[c.weather] || 0) + (c.trucks - 12) / 4 + ({ few: 0, normal: 1, many: 2.2 }[c.faults] || 0) + c.permits / 3 + c.rail * 0.4 + (c.hints ? 0 : 1) + (c.autoPause ? 0 : 0.6);
    return p < 6 ? 'Easy' : p < 13 ? 'Normal' : p < 18.5 ? 'Hard' : 'Expert';
  }
  function seg(field, opts) {
    return '<div class="seg" role="group">' + opts.map(([v, lbl]) => '<button type="button" class="' + (startCfg[field] === v ? 'on' : '') + '" data-s="set" data-f="' + field + '" data-v="' + v + '"' + (field === 'approvals' && startCfg.autonomy !== 'full' ? ' disabled' : '') + '>' + lbl + '</button>').join('') + '</div>';
  }
  function settingsHTML() {
    const c = startCfg;
    let h = '<div class="presets" role="group" aria-label="Presets">';
    for (const k of PRESET_ORDER) h += '<button type="button" class="preset' + (startPreset === k ? ' on' : '') + '" data-s="preset" data-k="' + k + '"><b>' + PR[k].label + '</b><span>' + PR[k].crew + ' operator' + (PR[k].crew > 1 ? 's' : '') + ' · ' + ({ off: 'no crew autonomy', field: 'crew do field work', full: 'crew run routine work' }[PR[k].autonomy]) + '</span></button>';
    h += '<button type="button" class="preset' + (startPreset === 'custom' ? ' on' : '') + '" data-s="preset" data-k="custom"><b>Custom</b><span>your own mix</span></button></div>';
    h += '<div class="setgrid">';
    h += '<div class="setrow"><div><b>Field operators on site</b><span>More hands get field jobs done sooner.</span></div><div class="stepper"><button type="button" data-s="step" data-f="crew" data-d="-1" aria-label="Fewer operators">−</button><output>' + c.crew + '</output><button type="button" data-s="step" data-f="crew" data-d="1" aria-label="More operators">+</button></div></div>';
    h += '<div class="setrow"><div><b>Crew autonomy</b><span>' + AUTO_TXT[c.autonomy] + '</span></div>' + seg('autonomy', [['off', 'Off'], ['field', 'Field work'], ['full', 'Full']]) + '</div>';
    h += '<div class="setrow"><div><b>Key decisions</b><span>' + (c.autonomy === 'full' ? APPR_TXT[c.approvals] : 'Only used with full autonomy.') + '</span></div>' + seg('approvals', [['wait', 'Wait for me'], ['timeout', 'Crew act after 10 min'], ['auto', 'Crew decide']]) + '</div>';
    h += '<div class="setrow"><div><b>Weather</b><span>' + ({ calm: 'No thunderstorms.', changeable: 'A storm is possible.', stormy: 'Expect lightning stops.' }[c.weather]) + '</span></div>' + seg('weather', [['calm', 'Calm'], ['changeable', 'Changeable'], ['stormy', 'Stormy']]) + '</div>';
    h += '<div class="setrow"><div><b>Road tankers booked</b><span>' + c.trucks + ' trucks across the shift.</span></div><input type="range" id="set-trucks" min="6" max="28" step="1" value="' + c.trucks + '" data-sf="trucks" aria-label="Road tankers booked"></div>';
    h += '<div class="setrow"><div><b>Rail deliveries</b><span>Each drop is one or two propane cars.</span></div>' + seg('rail', [[0, 'None'], [1, 'One'], [2, 'Two']]) + '</div>';
    h += '<div class="setrow"><div><b>Faults and incidents</b><span>Equipment failures, document defects, leaks.</span></div>' + seg('faults', [['few', 'Few'], ['normal', 'Normal'], ['many', 'Many']]) + '</div>';
    h += '<div class="setrow"><div><b>Permit requests</b><span>' + c.permits + ' contractor jobs needing your signature.</span></div><input type="range" id="set-permits" min="0" max="9" step="1" value="' + c.permits + '" data-sf="permits" aria-label="Permit requests"></div>';
    h += '<div class="setrow"><div><b>Help</b><span>Hints flag expired documents and suggest presets. Auto-pause stops the clock on critical alarms.</span></div><div class="row"><label class="chk"><input type="checkbox" id="set-hints"' + (c.hints ? ' checked' : '') + ' data-sf="hints"> Hints</label><label class="chk"><input type="checkbox" id="set-ap"' + (c.autoPause ? ' checked' : '') + ' data-sf="autoPause"> Auto-pause</label><label class="chk"><input type="checkbox" id="opt-sound"' + (UI.sound ? ' checked' : '') + '> Alarm horn</label></div></div>';
    h += '</div><div class="row go-row"><span class="diffbadge">Difficulty: <b>' + difficultyOf(c) + '</b></span><label for="seed" class="small">Seed</label><input id="seed" type="number" min="1" placeholder="random" style="width:120px" value="' + e(store('hmt-seed') || '') + '"><button type="button" class="btn big" data-s="go">Take the shift</button></div>';
    return h;
  }
  function showStart() {
    if (L.tutor) L.tutor.end();
    UI.started = false; UI.paused = true;
    document.body.classList.add('pre');
    preview = L.sim.create({ seed: 4242, config: Object.assign({}, PR.tutorial, { narrate: false }), preset: 'tutorial' });
    if (W) { W.sel = null; W.camCtl.reset(); W.camCtl.want.dist = 175; W.camCtl.want.pitch = 0.62; }
    for (let i = 0; i < 180; i++) L.sim.tick(preview, 20);
    let h = '<div class="start-in"><div class="hero"><div><div class="eyebrow">HMT · day shift · 06:00–18:00</div><h1>Harrowmere LPG Terminal</h1>';
    h += '<p class="lede">Run a pressurised LPG terminal for twelve hours. Road tankers queue at the gate, rail cars of propane wait to be unloaded, contractors want permits, and the plant does what LPG does in the sun.</p></div>';
    h += W ? '<div></div></div>' : '<div class="plant-wrap" aria-hidden="true">' + L.plantSvg.build() + '</div></div>';
    h += '<button type="button" class="watch" data-s="tutorial"><span class="watch-play" aria-hidden="true">▶</span><span><b>Watch a guided shift</b><span>New to terminals, or to the game? Sit back while an experienced crew runs the shift. Cards explain every decision as it happens, and you can take over whenever you like.</span></span></button>';
    h += '<h3 class="set-h">Or set up your own shift</h3><div id="settings">' + settingsHTML() + '</div>';
    h += '<div class="howto"><div><h4>Your site</h4>Drag to pan, right-drag (or two fingers) to rotate, scroll or pinch to zoom. Hover anyone or anything to see what it is doing. Select a field operator, then click a sphere, rail car, skid, detector or open ground to give an order.</div><div><h4>Your desk</h4>The <b>Needs you</b> panel lists every decision waiting on you, including approvals your crew ask for. Console pages slide in from the left. Click an alarm for its response procedure.</div>';
    h += '<div><h4>A truck\'s journey</h4>Inspect documents at the gate → weigh in → call to a bay → driver\'s checks → set the preset and authorise → load → weigh out → release, or decant if it is over the limit.</div>';
    h += '<div><h4>When it goes wrong</h4>A detector reading means a leak upwind. Stop transfers, isolate, keep people out of the cloud, cool what is exposed. The handbook explains every rule and the accidents behind them.</div></div></div>';
    $('start').hidden = false;
    $('start').className = 'start' + (W ? ' over-world' : '');
    $('start').innerHTML = h;
    if (!W) L.plantSvg.update($('start'), preview);
  }
  function refreshSettings() {
    const el = document.getElementById('settings');
    if (el) el.innerHTML = settingsHTML();
    store('hmt-cfg', JSON.stringify({ preset: startPreset, cfg: startCfg }));
  }
  function startShift(cfg, seed, presetKey, tutorial) {
    if (seed) store('hmt-seed', String(seed));
    S = L.sim.create({ config: cfg, preset: presetKey || 'custom', seed: seed || undefined });
    preview = null;
    if (W) { W.sel = null; W.hover = null; W.camCtl.reset(); }
    UI.selCrew = null; UI.followKey = null; UI.sideMin = window.innerWidth < 760; UI.sideTab = 'needs';
    UI.tab = W ? 'site' : 'overview';
    UI.sel = {}; UI.hist = {}; UI.lastHist = -1e9; UI.seenToast = S.toastSeq; UI.drafts = {}; UI.modal = null; UI.pauseReason = null; UI.silencedSeq = 0;
    UI.started = true; UI.paused = false; UI.speed = 30; UI.tutorHold = false;
    document.body.classList.remove('pre');
    UI.alarmMin = window.innerWidth < 640;
    mountedTab = null;
    $('start').hidden = true;
    $('start').innerHTML = '';
    audioInit();
    window.LPG.S = S;
    if (tutorial && L.tutor) { UI.speed = 30; L.tutor.begin(S); document.body.classList.add('tutorial'); }
    else document.body.classList.remove('tutorial');
    renderAll();
  }
  function startTutorial() {
    store('hmt-tut-seen', '1');
    startShift(Object.assign({}, PR.tutorial, { narrate: true }), undefined, 'tutorial', true);
  }
  function onStartClick(ev) {
    const el = ev.target.closest('[data-s]');
    if (!el || el.disabled) return;
    const kind = el.getAttribute('data-s');
    if (kind === 'preset') {
      const k = el.getAttribute('data-k');
      startPreset = k;
      if (PR[k]) startCfg = Object.assign({}, PR[k]);
      refreshSettings();
    } else if (kind === 'set') {
      const f = el.getAttribute('data-f'); let v = el.getAttribute('data-v');
      if (f === 'rail') v = +v;
      startCfg[f] = v; startPreset = 'custom'; refreshSettings();
    } else if (kind === 'step') {
      const f = el.getAttribute('data-f');
      startCfg[f] = U.clamp(startCfg[f] + (+el.getAttribute('data-d')), 1, D.PEOPLE.crew.length); startPreset = 'custom'; refreshSettings();
    } else if (kind === 'tutorial') {
      const snd = document.getElementById('opt-sound'); if (snd) UI.sound = snd.checked;
      startTutorial();
    } else if (kind === 'go') {
      const sv = +document.getElementById('seed').value;
      const snd = document.getElementById('opt-sound'); if (snd) UI.sound = snd.checked;
      const cfg = Object.assign({}, startCfg, { label: startPreset === 'custom' ? 'Custom (' + difficultyOf(startCfg) + ')' : PR[startPreset].label, base: difficultyOf(startCfg) === 'Easy' ? 'trainee' : difficultyOf(startCfg) === 'Normal' ? 'operator' : 'senior' });
      startShift(cfg, sv > 0 ? Math.floor(sv) : undefined, startPreset);
    }
  }
  function onStartInput(ev) {
    const t = ev.target;
    const f = t.getAttribute && t.getAttribute('data-sf');
    if (!f) return;
    startCfg[f] = t.type === 'checkbox' ? t.checked : +t.value;
    startPreset = 'custom';
    if (t.type === 'range') { const row = t.closest('.setrow'); const sp = row && row.querySelector('span'); if (sp) sp.textContent = f === 'trucks' ? startCfg.trucks + ' trucks across the shift.' : startCfg.permits + ' contractor jobs needing your signature.'; document.querySelectorAll('.preset').forEach((b) => b.classList.toggle('on', b.getAttribute('data-k') === 'custom')); const db = document.querySelector('.diffbadge b'); if (db) db.textContent = difficultyOf(startCfg); store('hmt-cfg', JSON.stringify({ preset: startPreset, cfg: startCfg })); }
    else refreshSettings();
  }

  // ------------------------------------------------------------------ World pointer handling
  function worldInput() {
    const cv = W.renderer.domElement;
    let lastMove = 0, downAt = null;
    cv.addEventListener('pointermove', (ev) => {
      UI.hoverX = ev.clientX; UI.hoverY = ev.clientY;
      const now = performance.now();
      if (now - lastMove < 50 || !S || !UI.started) return;
      lastMove = now;
      const p = W.pick(ev.clientX, ev.clientY);
      W.hover = p && p.kind !== 'ground' && p.kind !== 'icon' ? p : null;
      UI.hoverPick = p && p.kind !== 'ground' ? p : null;
      cv.style.cursor = UI.hoverPick ? 'pointer' : UI.selCrew ? 'crosshair' : 'grab';
      L.hud.tooltip(S, UI.hoverPick, ev.clientX, ev.clientY);
    });
    cv.addEventListener('pointerleave', () => { $('tip').hidden = true; UI.hoverPick = null; W.hover = null; });
    cv.addEventListener('pointerdown', (ev) => { downAt = { x: ev.clientX, y: ev.clientY, b: ev.button }; $('ctx').hidden = true; });
    cv.addEventListener('pointerup', (ev) => {
      if (!downAt || !S || !UI.started) return;
      const moved = Math.hypot(ev.clientX - downAt.x, ev.clientY - downAt.y) > 6 || W.camCtl.dragged;
      const b = downAt.b; downAt = null;
      if (moved) return;
      const p = W.pick(ev.clientX, ev.clientY);
      worldClick(p, ev.clientX, ev.clientY, b);
      renderAll();
    });
    cv.addEventListener('dblclick', (ev) => { const p = W.pick(ev.clientX, ev.clientY); if (p && p.point) W.camCtl.focus(p.point.x, p.point.z, Math.min(W.camCtl.want.dist, 60)); });
    W.onThunder = (km) => thunder(km);
  }
  function worldClick(p, cx, cy, button) {
    $('ctx').hidden = true;
    if (!p) return;
    if (p.kind === 'icon') return iconClick(p.id);
    if (UI.selCrew && p.kind !== 'crew') { L.hud.showOrders(S, UI.selCrew, p, cx, cy); return; }
    if (button === 2) return;
    if (p.kind === 'ground') { UIA.deselect(); return; }
    W.sel = { kind: p.kind, id: p.id, key: p.key, pos: p.pos ? { x: p.pos.x, z: p.pos.z } : null };
    UI.selCrew = p.kind === 'crew' ? p.id : null;
    if (UI.followKey && UI.followKey !== p.key) { UI.followKey = null; W.camCtl.follow = null; }
  }
  function iconClick(key) {
    const m = (re) => key.match(re);
    let r;
    if (key === 'gate') { const q = S.trucks.find((t) => t.state === 'QUEUE'); if (q) UI.modal = { type: 'truck', id: q.id }; return; }
    if ((r = m(/^bay(\d)/)) || (r = m(/^eng(\d)/))) return UIA.nav('rack', +r[1]);
    if (m(/^rel/)) return UIA.nav('gate');
    if (m(/^pl/)) return UIA.nav('utilities');
    if (m(/^(gd|fire|inj)/)) return UIA.nav('fg');
    if (m(/^(car|comp)/)) return UIA.nav('rail');
    if ((r = m(/^pm(.+)/))) return UIA.nav('permits', r[1]);
    if ((r = m(/^tk(.+)/))) return UIA.nav('tanks', r[1]);
    if ((r = m(/^ap(\d+)/))) { UI.sideMin = false; UI.sideTab = 'needs'; return UIA.apprShow(+r[1]); }
  }
  function thunder(km) {
    if (!actx || !UI.sound) return;
    try {
      const len = 2.4, sr = actx.sampleRate, buf = actx.createBuffer(1, sr * len, sr), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
      const src = actx.createBufferSource(); src.buffer = buf;
      const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 180;
      const g = actx.createGain(); const now = actx.currentTime + Math.min(3, km / 3);
      g.gain.setValueAtTime(0, actx.currentTime); g.gain.setValueAtTime(0.0001, now); g.gain.linearRampToValueAtTime(0.25 * Math.max(0.2, 1 - km / 25), now + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, now + len);
      src.connect(f); f.connect(g); g.connect(actx.destination); src.start(now);
    } catch (err) { /* audio is optional */ }
  }

  function boot() {
    W = L.world ? L.world.init($('world')) : null;
    if (W) { worldInput(); L.hud.minimapMount($('minimap')); L.app.world = W; }
    else { TABS = TABS.filter((t) => t[0] !== 'site'); document.body.classList.add('no-world'); }
    $('minimap').addEventListener('click', (ev) => { if (!W) return; const p = L.hud.minimapClick($('minimap'), ev); if (p) { W.camCtl.focus(p.x, p.z); W.camCtl.follow = null; } });
    document.getElementById('ctx').addEventListener('click', onClick);
    document.getElementById('inspector').addEventListener('click', onClick);
    const th = store('hmt-theme');
    if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th);
    document.getElementById('app').addEventListener('click', onClick);
    document.getElementById('modal').addEventListener('click', onClick);
    document.getElementById('pausebar').addEventListener('click', onClick);
    document.getElementById('lesson').addEventListener('click', onClick);
    document.getElementById('start').addEventListener('click', onStartClick);
    document.getElementById('start').addEventListener('change', onStartInput);
    document.getElementById('start').addEventListener('input', (ev) => { if (ev.target.type === 'range') onStartInput(ev); });
    document.getElementById('tutor').addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('change', onInput);
    document.addEventListener('keydown', onKey);
    document.addEventListener('pointerdown', (ev) => { UI.pressed = ev.target; }, true);
    const release = () => setTimeout(() => { UI.pressed = null; }, 0);
    document.addEventListener('pointerup', release, true);
    document.addEventListener('pointercancel', release, true);
    // First visit: start with the guided shift. Afterwards, the settings screen.
    if (!store('hmt-tut-seen') && W) startTutorial(); else showStart();
    requestAnimationFrame(frame);
  }

  L.app = { boot, UIA, attention, get S() { return S; }, get W() { return W; } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(globalThis.LPG = globalThis.LPG || {});

</script>
